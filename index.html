<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuesports Referee Mock Exams</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single centred column; home = mock papers + question bank; quiz = one question per screen with sticky scoreboard bar */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18221d; --muted:#5d6a63; --line:#d9e0db;
  --baize:#1d6a4b; --baize-soft:#e2efe8; --chalk:#2b67a3; --chalk-soft:#e3ecf6;
  --good:#1e7a3c; --good-soft:#e1f2e6; --bad:#b3261e; --bad-soft:#f9e3e1; --warn:#a46200;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18201c; --ink:#e6ece8; --muted:#9aa8a0; --line:#2b3631;
  --baize:#4fbf8a; --baize-soft:#183327; --chalk:#7fb2e6; --chalk-soft:#172a3d;
  --good:#5cc983; --good-soft:#163222; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#e3a54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201c; --ink:#e6ece8; --muted:#9aa8a0; --line:#2b3631;
  --baize:#4fbf8a; --baize-soft:#183327; --chalk:#7fb2e6; --chalk-soft:#172a3d;
  --good:#5cc983; --good-soft:#163222; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#e3a54a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2.1rem;line-height:1.05}
h2{font-size:1.5rem}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{color:var(--muted);margin:.4rem 0 0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
section.block{display:flex;flex-direction:column;gap:14px;padding-top:18px;border-top:1px solid var(--line)}
button,select{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--baize);border-color:var(--baize);color:var(--surface)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 8px;border-radius:8px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--baize);background:var(--baize-soft);color:var(--baize)}
.papers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.paper{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.paper:hover{border-color:var(--baize)}
.paper .t{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.paper .m{color:var(--muted);font-size:.9rem}
.paper .last{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.lbl{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.prog-row{display:grid;grid-template-columns:8.5rem 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.prog-row .bar2{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.prog-row .bar2 i{display:block;height:100%}
.prog-row .bar2 .g{background:var(--good)} .prog-row .bar2 .r{background:var(--bad)}
.prog-row .num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
/* quiz bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:16px}
.bar-in{display:flex;align-items:center;gap:12px;justify-content:space-between}
.timer{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--baize);width:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.tag.S{background:var(--baize-soft);color:var(--baize)}
.tag.B{background:var(--chalk-soft);color:var(--chalk)}
.tag.P{background:var(--bad-soft);color:var(--bad)}
.tag.t{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.red{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.qnum{font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.qtext{font-size:1.15rem;font-weight:600;margin:10px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px;border-radius:8px}
.opt .k{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);min-width:1.2em}
.opt[aria-pressed="true"]{border-color:var(--chalk);background:var(--chalk-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fill{display:flex;gap:8px;flex-wrap:wrap}
.fill input{flex:1 1 200px;min-width:0;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.explain{margin-top:12px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.flag[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:8px}
.grid button{font-family:var(--f-mono);font-size:.78rem;padding:6px 0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px}
.grid button.done{background:var(--chalk-soft);color:var(--chalk);border-color:var(--chalk)}
.grid button.cur{outline:2px solid var(--ink)}
.grid button.fl{border-color:var(--warn);color:var(--warn)}
.grid button.r{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.grid button.w{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.grid .sec{grid-column:1/-1;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
.confirm{border:1px solid var(--warn);background:var(--surface);border-radius:10px;padding:14px;margin-top:14px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.score{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px}
.score .n{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .n small{font-size:1.1rem;color:var(--muted)}
.pill{display:inline-block;font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:999px;margin-top:6px}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.rev{border-left:3px solid var(--line);padding:8px 0 8px 12px}
.rev.ok{border-left-color:var(--good)} .rev.no{border-left-color:var(--bad)}
.rev p{margin:.2rem 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}.prog-row{grid-template-columns:6.5rem 1fr auto}}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .2s}}
</style>
</head>

<script>
const BANK = {"S": [["What is the maximum weight variance allowed in a set of snooker balls?", ["3 g", "0.5 g", "1 g", "5 g"], "\u00a71.2 \u2014 equal weight where possible, max 3 g variance in a snooker set. (Billiards is 0.5 g.)"], ["Where is the Brown spotted?", ["Middle of the Baulk-line", "Right-hand corner of the \"D\"", "Left-hand corner of the \"D\"", "Centre Spot"], "\u00a71.1 (f) \u2014 Brown sits in the middle of the Baulk-line."], ["Viewed from the Baulk end, which spot is on the right-hand corner of the \"D\"?", ["Yellow", "Green", "Brown", "Blue"], "\u00a71.1 (f) \u2014 right-hand corner is Yellow, left-hand corner is Green."], ["What is the value of the Pink?", ["6", "5", "7", "4"], "Ball values: Yellow 2, Green 3, Brown 4, Blue 5, Pink 6, Black 7."], ["How far is the Black Spot from the face of the Top Cushion?", ["12\u00be in (324 mm)", "11\u00bd in (292 mm)", "29 in (737 mm)", "10 in (254 mm)"], "\u00a71.1 (f) \u2014 Black Spot is 12\u00be in (324 mm) from a point below the Top Cushion face."], ["Black is the only object ball left, scores are not equal. What ends the frame?", ["The first pot or foul", "Only a pot of the Black", "Only a foul", "Three more strokes each"], "\u00a73.4 (a) \u2014 when Black is the only object ball remaining, the first pot or foul ends the frame."], ["Scores are tied after the final Black and aggregate is not relevant. What happens?", ["Black is re-spotted, players draw lots, the next player plays from in-hand", "Frame is a draw", "The player who potted the Black wins", "Black is re-spotted and the last striker plays again"], "\u00a73.4 (b) \u2014 Black spotted, draw lots for choice, play from in-hand; first pot or infringement ends the frame."], ["A ball that enters a pocket in a foul stroke is said to be\u2026", ["Pocketed", "Potted", "Forced off", "Spotted"], "\u00a72.7 \u2014 causing a ball to enter a pocket in a foul stroke is pocketing, not potting."], ["The referee asks the striker which ball they are on and the striker fails to declare. Penalty?", ["7 points", "4 points", "Value of the ball on", "No penalty, just a warning"], "\u00a72.12 (b) / \u00a73.11 (d)(v) \u2014 failing to declare when requested is a seven-point foul."], ["Which statement about snookers is correct?", ["The cue-ball cannot be snookered by a cushion", "A cushion can snooker the cue-ball", "A ball on can snooker the cue-ball", "Snookers only count when Reds are on"], "\u00a72.17 (d, e) \u2014 the cue-ball cannot be snookered by a cushion."], ["During a consultation period, the non-striker touches a ball on the table. Penalty?", ["7 points to the opponent", "4 points", "No penalty, the non-striker is not in play", "Value of the ball touched"], "\u00a72.22 / \u00a73.11 (f) \u2014 touching any ball during a consultation period is seven points, for either player."], ["What is the difference between a foul and a penalty?", ["A penalty does not affect the order of play", "A penalty always costs 7 points", "A foul does not end the turn", "There is no difference"], "\u00a72.15 \u2014 a foul ends the offender's turn; a penalty does not affect the order of play."], ["A Red has been spotted in error and cannot be identified. What happens?", ["The frame continues with a sixteenth Red", "The frame is re-started", "A Red is removed at random", "The striker chooses a Red to remove"], "\u00a73.7 (d) \u2014 if not identifiable, the frame continues with a sixteenth Red."], ["A colour was wrongly spotted after being potted in ascending order. It is discovered before being potted again. What happens?", ["It is removed from the table without penalty and play continues", "It is a foul on the striker", "The frame is re-started", "It stays on the table until potted"], "\u00a73.7 (b) \u2014 a colour spotted in error after being potted in ascending order is removed without penalty."], ["A ball on the edge of a pocket falls in by itself, not as part of any stroke. Decision?", ["It is replaced and any points scored count", "It counts as potted", "It is a foul on the striker", "It is spotted on its own spot"], "\u00a73.9 (a) \u2014 replaced, and any points scored shall count."], ["A ball balances momentarily on the pocket edge, then falls in as a result of the stroke. Decision?", ["It is considered potted or pocketed and not replaced", "It is replaced", "The stroke is replayed", "It is a foul"], "\u00a73.9 (c) \u2014 balancing momentarily then falling in = potted or pocketed, not replaced."], ["A striker commits two fouls in the same stroke. Which penalty applies?", ["The highest value penalty", "Both penalties added together", "The first foul's penalty", "Seven points automatically"], "\u00a73.10 (g) \u2014 if more than one foul is committed in a stroke, the highest value penalty is incurred."], ["Red is the ball on and the cue-ball goes in-off. Penalty?", ["4 points", "1 point", "7 points", "5 points"], "\u00a73.11 (a)(vii) \u2014 four points, or the ball on if higher. Red = 1, so 4."], ["Red is the ball on. The striker hits a Red but also pots the Pink. Penalty?", ["6 points", "4 points", "1 point", "7 points"], "\u00a73.11 (b)(iii) \u2014 value of the ball on or the ball concerned, whichever is higher, minimum four. Pink = 6."], ["Red is the ball on and the striker makes a push stroke. Penalty?", ["4 points", "1 point", "7 points", "No penalty if a Red is potted"], "\u00a73.11 (b)(v) \u2014 value of ball on or ball concerned, minimum four."], ["Blue is the ball on and the striker plays a jump shot. Penalty?", ["5 points", "4 points", "7 points", "6 points"], "\u00a73.11 (a)(x) \u2014 four points, or the ball on if higher. Blue = 5."], ["The striker uses a ball off the table to judge a gap. Penalty?", ["7 points", "4 points", "Value of the ball on", "Warning only"], "\u00a73.11 (d)(i) \u2014 using a ball off the table for any purpose is seven points."], ["When does the referee call FREE BALL?", ["After a foul, if the cue-ball is snookered", "After any foul", "When the striker asks for one", "When the cue-ball is touching a ball"], "\u00a73.12 \u2014 after a foul, if the cue-ball is snookered (see \u00a72.17), the referee calls FREE BALL."], ["The nominated free ball is potted. What happens?", ["It is spotted and the value of the ball on is scored", "It stays off and scores its own value", "It is spotted and scores its own value", "It is a foul"], "\u00a73.12 (c) \u2014 free ball potted: it is spotted and the value of the ball on is scored."], ["Red is on. The striker nominates the Green as a free ball, then pots the Green and a Red. Score?", ["2 points", "4 points", "1 point", "3 points"], "\u00a73.12 (e) \u2014 when the ball on is a Red, each ball potted is scored: 1 + 1 = 2. The Green is spotted."], ["When does the free ball option become void?", ["When the offender is asked to play again", "When the incoming player hits the free ball", "After 3 strokes", "It never becomes void"], "\u00a73.12 (f) \u2014 if the offender is asked to play again (or balls are replaced), the free ball option is void."], ["A player asks the offender to play again after a foul, then changes their mind. Can they?", ["No, the request cannot be withdrawn", "Yes, before the next stroke", "Yes, with the referee's permission", "Yes, once per frame"], "\u00a73.13 \u2014 once requested, it cannot be withdrawn."], ["Which is an exception to calling FOUL AND A MISS?", ["A player required penalty points and the referee is satisfied the miss was not intentional", "The striker is in the lead", "The ball on is a colour", "It is the first stroke of the frame"], "\u00a73.14 (a)(i) \u2014 penalty points required and the miss was not intentional."], ["With a clear ball on, the striker fails a second time from the original position. The score difference makes snookers required. Call?", ["FOUL AND A MISS, regardless of the difference in scores", "FOUL only", "FOUL AND A MISS only if the leader played", "Award the frame"], "\u00a73.14 (d)(i) \u2014 a second failure from the original position is a FOUL AND A MISS regardless of the difference in scores."], ["When can a frame NOT be awarded under the miss rule?", ["When a Warning has not been issued", "When fewer than 3 misses have occurred", "When Reds are still on the table", "When the scores are level"], "\u00a73.14 (d)(ii) \u2014 a frame cannot be awarded if a Warning has not been issued."], ["After a FOUL AND A MISS, the non-offender asks the offender to play from the position left. What happens to the miss sequence?", ["The sequence ends", "It continues", "The Warning stays in force", "The frame is awarded"], "\u00a73.14 (d)(iii) \u2014 if asked to play from the position left, the sequence ends."], ["For Reds, what counts as a clear ball for the miss rule?", ["The full diameter of any Red not obstructed by a colour", "Any part of any Red", "Half a Red", "Both edges of every Red"], "\u00a73.14 (d) \u2014 in the case of Reds, a full diameter of any Red that is not obstructed by a colour."], ["Balls have been replaced after a miss. Before playing a stroke, the striker touches the cue-ball with their sleeve. Decision?", ["FOUL \u2014 a miss will not be called; the appropriate penalty applies", "FOUL AND A MISS", "No foul, the balls are replaced again", "Award the frame"], "\u00a73.14 (e) \u2014 if a stroke has not been played, a MISS will not be called; the appropriate penalty may be imposed."], ["When does a Warning (about awarding the frame) survive a foul made before a stroke, after replacement?", ["Only when all balls are replaced to their original position", "Always", "Never", "Only if the offender is asked to play from the position left"], "\u00a73.14 (e) \u2014 the Warning remains in effect only when all balls have been replaced to their original position."], ["When does a consultation period start after a FOUL AND A MISS?", ["When a request is made to play from the original position", "Immediately after the call", "When the offender asks", "After the referee replaces the balls"], "\u00a73.14 (f) \u2014 if the request is to play from the original position, a consultation period starts."], ["A spectator knocks a ball. What does the referee do?", ["Replace it where it was or would have come to rest, no penalty", "Call FOUL on the striker", "Re-rack the frame", "Leave it where it stopped"], "\u00a73.15 \u2014 a ball disturbed other than by the striker is replaced without penalising the striker."], ["A ball moves because of a defect in the table surface (not a freshly spotted ball). Is it replaced?", ["No, \u00a73.15 does not apply to table defects", "Yes, always", "Yes, and the striker gets a free ball", "Only if it enters a pocket"], "\u00a73.15 (a) \u2014 it does not apply where a ball moves due to a defect in the table surface (except a spotted ball before the next stroke)."], ["The striker intentionally picks up a ball from the playing area. Call?", ["FOUL", "PENALTY", "Warning", "No call"], "\u00a73.16 \u2014 a ball intentionally moved or picked up by the striker is a FOUL."], ["The referee thinks a stalemate is approaching. A player objects to a re-rack. What then?", ["Play continues; the situation must change within a stated period, usually three more strokes each", "The frame is re-racked anyway", "The frame is awarded", "Play continues with no limit"], "\u00a73.17 (a)\u2013(b) \u2014 the situation must change within a stated period, usually three more strokes each side."], ["A stalemate occurs during a re-spotted Black. What happens?", ["Only the Black is spotted, with the same player making the opening stroke", "Full re-rack", "The frame is drawn", "The other player breaks"], "\u00a73.17 (d) \u2014 only the Black is spotted, same player to make the opening stroke."], ["A rest normally found at the table, provided by the referee, proves faulty and causes the striker to touch a ball. Decision?", ["Not a foul \u2014 the equipment is not the striker's responsibility", "Foul \u2014 4 points", "Foul \u2014 value of the ball touched", "Penalty \u2014 turn con  balls spotted", "From the \"D\"", "Their choice"], "\u00a73.17."], ["Four-handed billiards: who decides the order of play after the opening side is decided?", ["The next player", "The referee", "The opening side", "Lots"], "\u00a73.18 (a)."], ["Four-handed billiards: when may partners confer?", ["During the game, but not while one is the striker and has approached the table until the break ends", "Any time", "Never", "Only after a foul"], "\u00a73.18 (b)."], ["Does the no-conferring rule apply to individual games in a team match?", ["Yes", "No", "Only in finals", "Only in four-handed"], "\u00a73.18 (b)."], ["A rest borrowed from the referee breaks, causing the striker to move a ball. Decision?", ["Not a foul; balls repositioned; break continues", "Foul \u2014 2 points", "Penalty", "Replay"], "\u00a73.19 (b)."], ["There is no referee in a billiards game. Who acts as referee?", ["The opposing player or side", "The marker", "Nobody", "The striker"], "\u00a73.20 (b)."], {"f": 1, "q": "If a miss is played without running a coup, the referee calls ____.", "a": ["miss"], "show": "MISS", "e": "\u00a73.17."}, {"f": 1, "q": "A foul costs ____ points, added to the opponent's score.", "a": ["2", "two"], "show": "2", "e": "\u00a73.16 (c)."}, {"f": 1, "q": "A pot of the Red or an in-off the Red scores ____ points.", "a": ["3", "three"], "show": "3", "e": "\u00a73.4 (b)."}, {"f": 1, "q": "A cannon scores ____ points.", "a": ["2", "two"], "show": "2", "e": "\u00a73.4 (a)."}, {"f": 1, "q": "When the cue-ball remains touching another ball, the referee calls ____ ____.", "a": ["touchingball"], "show": "TOUCHING BALL", "e": "\u00a73.14 (a)."}, {"f": 1, "q": "After TOUCHING BALL, the non-striker's ball is placed on the ____ Spot.", "a": ["centre", "center"], "show": "Centre", "e": "\u00a73.14 (a)."}, {"f": 1, "q": "After a foul, the next player may play from in-hand with the Red on the Spot and the opponent's ball on the ____ Spot.", "a": ["centre", "center"], "show": "Centre", "e": "\ , ["8, 9 & 10-Ball: Which of these makes a lag bad?", ["The ball touches a side cushion", "The ball contacts the foot cushion once", "The ball stops above the Head String", "The ball is struck at the same time as the other"], "\u00a71.2 (d) \u2014 touching a side cushion makes a lag bad."], ["8, 9 & 10-Ball: When do the players lag again?", ["When the referee cannot determine which ball stopped closer", "When one lag is bad", "When both balls hit the foot cushion", "When a player asks"], "\u00a71.2 (g) \u2014 players lag again if the referee cannot determine which ball stopped closer (also if both lags are bad)."], ["8, 9 & 10-Ball: An object ball must be spotted and the cue-ball blocks the spot. How is it placed?", ["Behind it on the Long String, keeping a small separation from the cue-ball", "Frozen to the cue-ball", "On the Head Spot", "The cue-ball is moved"], "\u00a71.5 \u2014 normally in contact with the interfering ball, except if the cue-ball is blocking: keep a small separation."], ["8, 9 & 10-Ball: With cue-ball in hand, the player moves it with the cue tip. Is that allowed?", ["Yes, but not with a forward stroke motion", "No, it is a foul", "Only with the ferrule", "Only with the hand"], "\u00a71.6 \u2014 any part of the cue may move it, including the tip, but not with a forward stroke motion."], ["8, 9 & 10-Ball: Which is correct about mechanical bridges?", ["Up to two may be used and the cue must rest on the bridge head", "Only one may be used", "The cue may rest on the bridge shaft", "Bridges are not allowed on the break"], "\u00a71.4 \u2014 up to two bridges; the cue MUST rest on the bridge head."], ["8, 9 & 10-Ball: A ball stays motionless on the pocket edge for 5 seconds after the shot, then falls in. Decision?", ["It is not pocketed and is replaced on the edge", "It is pocketed", "It is spotted", "It is a foul"], "\u00a72.2 \u2014 a ball motionless at the edge for 5 seconds is not pocketed if it falls later."], ["8, 9 & 10-Ball: The cue-ball enters function draw(pool,n){let pick=shuffle(pool).slice(0,n);const need=Math.ceil(n*REDMIN)-pick.filter(x=>x.red).length;if(need>0){const extra=shuffle(pool.filter(x=>x.red&&!pick.includes(x))).slice(0,need);let k=0;pick=pick.map(x=>(!x.red&&k<extra.length)?extra[k++]:x)}return shuffle(pick)}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)}
function sec(e){const m=String(e).match(/§\s*(\d+)(?:\.(\d+))?/);return m?[+m[1],m[2]?+m[2]:0]:null}
function topicOf(d,q,e){
  const t=q.toLowerCase(),ex=String(e);
  if(d==="P"){
    if(/^comparing/i.test(q)||/comparison/i.test(ex))return "Comparing disciplines";
    if(/three-ball/.test(t))return "9-Ball";
    const pre=q.split(":")[0],multi=/^8, 9 & 10-Ball|\//.test(pre);
    const m=q.match(/\b(8|9|10)-Ball\b/); if(m&&!multi&&!/disciplines|which discipline/i.test(q))return m[1]+"-Ball";
    if(/reg/i.test(ex.split("—")[0])||/^Reg/.test(ex))return "Regulations";
    const s=sec(ex); if(!s)return "General rules";
    return {1:"General rules",2:"Definitions",3:"Fouls",4:"8-Ball",5:"9-Ball",6:"10-Ball"}[s[0]]||"General rules";
  }
  const s=sec(ex);
  if(d==="S"){
    if(!s)return /value/i.test(ex)?"Equipment & ball values":"Officials";
    const [a,b]=s;
    if(a===1)return "Equipment & ball values"; if(a===2)return "Definitions";
    if(a===3){if(b<=9)return "The game & spotting"; if(b<=11)return "Fouls & penalty values"; if(b<=13)return "Free ball & play again"; if(b===14)return "Foul and a miss"; return "Other rules (3.15–3.21)";}
    if(a===4)return "Players"; return "Officials";
  }
  if(!s)return "The game";
  const [a,b]=s;
  if(a===1)return "Equipment"; if(a===2)return "Definitions";
  if(a===3){if(b<=7)return "Start, scoring & in-hand"; if(b===8)return "Baulk-line crossing"; if(b<=11)return "Spotting & limits"; if(b<=14)return "Edge, moved & touching ball"; return "Fouls & misses";}
  if(a===4)return "Players"; return "Officials";
}
const Q={S:[],B:[],P:[]};
for(const d of ["S","B","P"])BANK[d].forEach((raw,ri)=>{
  const red=!!(REDF[d]&&REDF[d][ri]);
  const isF=!Array.isArray(raw),q=isF?raw.q:raw[0],e=isF?raw.e:raw[2];
  Q[d].push(isF?{d,id:d+hash(q),q,fill:true,acc:raw.a.map(norm),show:raw.show,e,red,topic:topicOf(d,q,e)}
             :{d,id:d+hash(q),q,raw:raw[1],e,red,topic:topicOf(d,q,e)});
});
const ORDER={S:["Equipment & ball values","Definitions","The game & spotting","Fouls & penalty values","Free ball & play again","Foul and a miss","Other rules (3.15–3.21)","Players","Officials"],
 B:["Equipment","Definitions","Start, scoring & in-hand","Baulk-line crossing","Spotting & limits","Edge, moved & touching ball","Fouls & misses","Players","Officials","The game"],
 P:["General rules","Definitions","Fouls","8-Ball","9-Ball","10-Ball","Comparing disciplines","Regulations"]};
const TOPICS={};for(const d in Q){const rank=t=>{const i=ORDER[d].indexOf(t);return i<0?99:i};
  Q[d]=Q[d].map((x,i)=>[x,i]).sort((a,b)=>rank(a[0].topic)-rank(b[0].topic)||a[1]-b[1]).map(a=>a[0]);
  TOPICS[d]=[...new Set(Q[d].map(x=>x.topic))]}

/* ---------- helpers ---------- */
const app=document.getElementById("app");
const store={get(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function norm(s){return String(s).toLowerCase().replace(/½/g,"1/2").replace(/[\s.\-'"“”()]/g,"").replace(/^the/,"")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function inst(x){if(x.fill)return {...x};const opts=shuffle(x.raw);return {...x,opts,correct:opts.indexOf(x.raw[0])}}
function isRight(q,a){if(a==null||a==="")return false;return q.fill?q.acc.includes(norm(a)):a===q.correct}
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
let PROG=store.get("prog-v2",{}); // id -> 1 right / 0 wrong (latest attempt)
function record(q,a){PROG[q.id]=isRight(q,a)?1:0;store.set("prog-v2",PROG)}
function stats(d,topic){const list=Q[d].filter(x=>!topic||x.topic===topic);let r=0,w=0;list.forEach(x=>{if(PROG[x.id]===1)r++;else if(PROG[x.id]===0)w++});return {n:list.length,r,w}}

/* ---------- state ---------- */
let S={view:"home",mode:"exam",bd:"S",btopic:"",bfilter:"all",border:"order",bred:false,confirmReset:false};
let timerId;

function startMock(key){
  const p=PAPERS[key],qs=[];
  for(const d in p.draw){
    if(d==="B"){const m=draw(Q.B.filter(x=>!x.fill),p.draw.B-BFILL),f=draw(Q.B.filter(x=>x.fill),BFILL);qs.push(...m.map(inst),...f.map(inst))}
    else qs.push(...draw(Q[d],p.draw[d]).map(inst));
  }
  S={...S,view:"quiz",kind:"mock",paper:key,qs,ans:qs.map(()=>null),flag:qs.map(()=>false),locked:qs.map(()=>false),cur:0,end:Date.now()+p.mins*60000,confirm:false,gridOpen:false};
  render();window.scrollTo(0,0);if(S.mode==="exam")tick();
}
function bankList(){
  let list=Q[S.bd].filter(x=>(!S.btopic||x.topic===S.btopic)&&(!S.bred||x.red));
  if(S.bfilter==="new")list=list.filter(x=>PROG[x.id]==null);
  if(S.bfilter==="missed")list=list.filter(x=>PROG[x.id]===0);
  return S.border==="shuffle"?shuffle(list):list;
}
function startBank(){
  const list=bankList();if(!list.length)return;
  const qs=list.map(inst);
  S={...S,view:"quiz",kind:"bank",qs,ans:qs.map(()=>null),flag:qs.map(()=>false),locked:qs.map(()=>false),cur:0,confirm:false,gridOpen:false};
  saveBank();render();window.scrollTo(0,0);
}
function saveBank(){if(S.kind!=="bank")return;store.set("bank-session",{bd:S.bd,btopic:S.btopic,ids:S.qs.map(q=>q.id),ans:S.ans,cur:S.cur,
  opts:S.qs.map(q=>q.fill?null:q.opts)})}
function resumeBank(){
  const s=store.get("bank-session",null);if(!s)return;
  const byId={};Q[s.bd].forEach(x=>byId[x.id]=x);
  const qs=[],ans=[];s.ids.forEach((id,i)=>{const x=byId[id];if(!x)return;let q;
    if(x.fill)q={...x};else{const o=s.opts&&s.opts[i]&&s.opts[i].length===4&&s.opts[i].every(v=>x.raw.includes(v))?s.opts[i]:shuffle(x.raw);q={...x,opts:o,correct:o.indexOf(x.raw[0])}}
    qs.push(q);ans.push(s.ans[i]??null)});
  if(!qs.length)return;
  S={...S,view:"quiz",kind:"bank",bd:s.bd,btopic:s.btopic,qs,ans,flag:qs.map(()=>false),locked:ans.map(a=>a!=null&&a!==""),cur:Math.min(s.cur||0,qs.length-1),confirm:false,gridOpen:false};
  render();window.scrollTo(0,0);
}
function tick(){clearInterval(timerId);timerId=setInterval(()=>{const el=document.getElementById("timer");if(!el||S.view!=="quiz"){clearInterval(timerId);return}
  const left=S.end-Date.now();if(left<=0){clearInterval(timerId);finish();return}
  el.textContent=fmt(left);el.classList.toggle("low",left<300000)},500)}
function finish(){
  clearInterval(timerId);
  const res={};[...new Set(S.qs.map(q=>q.d))].forEach(d=>{const idx=S.qs.map((q,i)=>i).filter(i=>S.qs[i].d===d);res[d]={got:idx.filter(i=>isRight(S.qs[i],S.ans[i])).length,tot:idx.length,ans:idx.filter(i=>S.ans[i]!=null&&S.ans[i]!=="").length}});
  S.res=res;S.view="results";S.reviewWrong=true;
  if(S.kind==="mock"){S.qs.forEach((q,i)=>{if(S.ans[i]!=null&&S.ans[i]!=="")record(q,S.ans[i])});if(S.mode==="exam")store.set("last-"+S.paper,{res,at:Date.now()})}
  if(S.kind==="bank")store.del("bank-session");
  render();window.scrollTo(0,0);
}

/* ---------- views ---------- */

    <div class="papers">
      <button class="paper" id="go-sb"><span class="t">Snooker & Billiards</span><span class="m">50 Snooker + 20 Billiards (12 MCQ, 8 fill in) · ${S.mode==="exam"?"60 min":"untimed"}<br>Pass: 38/50 and 15/20</span><span class="last">${last("sb")}</span></button>
      <button class="paper" id="go-p"><span class="t">Pool</span><span class="m">30 MCQ · ${S.mode==="exam"?"30 min":"untimed"}<br>Pass: 23/30</span><span class="last">${last("p")}</span></button>
    </div>
  </section>

  <section class="block" aria-labelledby="h-bank">
    <div><h2 id="h-bank">Question bank</h2><p class="muted small" style="margin:.2rem 0 0">Work through every question with the answer and rule reference shown as you go. Your results are remembered on this device.</p></div>
    ${sess?`<div class="card row" style="justify-content:space-between"><span>Unfinished: <b>${NAMES[sess.bd]}</b>${sess.btopic?" · "+esc(sess.btopic):""} — question ${Math.min((sess.cur||0)+1,sess.ids.length)} of ${sess.ids.length}</span><button class="btn primary" id="resume">Resume</button></div>`:""}
    <div><div class="lbl">Discipline</div><div class="seg" role="group" aria-label="Discipline">
      ${["S","B","P"].map(d=>`<button data-bd="${d}" aria-pressed="${S.bd===d}">${NAMES[d]} · ${Q[d].length}</button>`).join("")}</div></div>
    <div class="two">
      <div><label class="lbl" for="btopic">Topic</label><select id="btopic"><option value="">All topics (${Q[S.bd].filter(x=>!S.bred||x.red).length})</option>${TOPICS[S.bd].map(t=>`<option value="${esc(t)}" ${S.btopic===t?"selected":""}>${esc(t)} (${Q[S.bd].filter(x=>x.topic===t&&(!S.bred||x.red)).length})</option>`).join("")}</select></div>
      <div><div class="lbl">Order</div><div class="seg" role="group" aria-label="Order"><button id="ord-o" aria-pressed="${S.border==="order"}">In order</button><button id="ord-s" aria-pressed="${S.border==="shuffle"}">Shuffled</button></div></div>
    </div>

      <button id="src-all" aria-pressed="${!S.bred}">All questions · ${Q[S.bd].length}</button><button id="src-red" aria-pressed="${S.bred}">Red slide wording only · ${Q[S.bd].filter(x=>x.red).length}</button></div></div>
    <div><div class="lbl">Which questions</div><div class="seg" role="group" aria-label="Which questions">

  </section>

function quiz(){
  const q=S.qs[S.cur],a=S.ans[S.cur],n=S.qs.length,done=S.ans.filter(x=>x!=null&&x!=="").length;
  const instant=S.kind==="bank"||S.mode==="practice",locked=S.locked[S.cur];
  let body;
  if(q.fill){
    body=`<div class="fill"><input id="fillin" type="text" autocomplete="off" autocapitalize="off" placeholder="Type your answer" value="${esc(a??"")}" ${locked?"disabled":""}>${instant&&!locked?'<button class="btn primary" id="check">Check</button>':""}</div>`;
  }else{
    body=`<div class="opts">${q.opts.map((o,i)=>{let c="";if(locked){if(i===q.correct)c="right";else if(i===a)c="wrong"}
      return `<button class="opt ${c}" data-o="${i}" aria-pressed="${a===i}" ${locked?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`}).join("")}</div>`;
  }
  const exp=locked?`<div class="explain">${isRight(q,a)?'<b class="ok">Correct.</b>':'<b class="no">Not quite.</b> Answer: <b>'+esc(q.fill?q.show:q.opts[q.correct])+'</b>.'} ${esc(q.e)}</div>`:"";
  const ds=[...new Set(S.qs.map(x=>x.d))];
  const showGrid=n<=400;
  const grid=showGrid?ds.map(d=>(ds.length>1?`<div class="sec">${NAMES[d]}</div>`:"")+S.qs.map((x,i)=>x.d!==d?"":(()=>{let c=[];if(S.ans[i]!=null&&S.ans[i]!=="")c.push(instant&&S.locked[i]?(isRight(x,S.ans[i])?"r":"w"):"done");if(S.flag[i])c.push("fl");if(i===S.cur)c.push("cur");return `<button data-go="${i}" class="${c.join(" ")}" aria-label="Question ${i+1}">${i+1}</button>`})()).join("")).join(""):"";
  const title=S.kind==="mock"?`Mock · ${PAPERS[S.paper].name}`:`${NAMES[S.qs[0].d]}${S.btopic?" · "+esc(S.btopic):""}`;

    ${S.kind==="mock"&&S.mode==="exam"?`<span class="timer" id="timer">${fmt(S.end-Date.now())}</span>`:`<span class="tag S">${S.kind==="bank"?"Bank":"Practice"}</span>`}

  <div class="card">

  </div>

  <details style="margin-top:18px" ${S.gridOpen?"open":""} id="gridbox"><summary>All questions in this ${S.kind==="bank"?"session":"paper"}</summary>${showGrid?`<div class="grid">${grid}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn" id="submit2">${S.kind==="bank"?"End session":"Finish and mark"}</button><button class="btn ghost" id="quit">${S.kind==="bank"?"Save and exit":"Quit to menu"}</button></div></details>`;

function results(){
  const ds=Object.keys(S.res);
  const cards=ds.map(d=>{const r=S.res[d];
    if(S.kind==="mock"){const need=PASS[d][0],ok=r.got>=need;
      return `<div class="score"><div class="eyebrow">${NAMES[d]}</div><div class="n">${r.got}<small>/${r.tot}</small></div><div class="muted small">${Math.round(r.got/r.tot*100)}% · need ${need}</div><span class="pill ${ok?"pass":"fail"}">${ok?"Pass":"Not yet — "+(need-r.got)+" short"}</span></div>`}
    const pct=r.ans?Math.round(r.got/r.ans*100):0;
    return `<div class="score"><div class="eyebrow">${NAMES[d]}</div><div class="n">${r.got}<small>/${r.ans}</small></div><div class="muted small">${pct}% right of ${r.ans} answered (${r.tot} in session)</div><span class="pill ${pct>=75?"pass":"fail"}">${pct>=75?"At pass level":"Below 75%"}</span></div>`}).join("");
  const list=S.qs.map((q,i)=>{const a=S.ans[i],answered=a!=null&&a!=="",ok=isRight(q,a);
    if(S.reviewWrong&&(ok||(S.kind==="bank"&&!answered)))return"";
    const your=!answered?"<i>No answer</i>":esc(q.fill?a:q.opts[a]);
    return `<div class="rev ${ok?"ok":"no"}"><p class="qnum">Q${i+1} · ${NAMES[q.d]} · ${esc(q.topic)}${q.red?" · Red slide":""}</p><p><b>${esc(q.q)}</b></p>
      ${ok?"":`<p>Your answer: ${your}</p>`}<p>Answer: <b>${esc(q.fill?q.show:q.opts[q.correct])}</b></p><p class="muted">${esc(q.e)}</p></div>`}).join("");
  return `<div class="stack" style="gap:18px">
  <header><div class="eyebrow">${S.kind==="mock"?"Mock · "+PAPERS[S.paper].name+" · "+(S.mode==="exam"?"Exam":"Practice"):"Question bank · "+NAMES[S.qs[0].d]+(S.btopic?" · "+esc(S.btopic):"")}</div><h1>${S.kind==="mock"?"Your result":"Session summary"}</h1></header>
  <div class="scores">${cards}</div>
  <div class="row">${S.kind==="mock"?'<button class="btn primary" id="again">New mock (fresh questions)</button>':'<button class="btn primary" id="retry">Practise the ones I got wrong</button>'}<button class="btn" id="menu">Back to menu</button></div>
  <div class="row" style="justify-content:space-between"><h2>Review</h2>
   <div class="seg" style="min-width:0"><button id="rw" aria-pressed="${S.reviewWrong}">Missed only</button><button id="ra" aria-pressed="${!S.reviewWrong}">All</button></div></div>
  <div class="stack">${list||'<p class="muted">Nothing missed. Well done.</p>'}</div></div>`;
}

/* ---------- events ---------- */
function bind(){
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.addEventListener("click",f)};
  if(S.view==="home"){
    on("mode-exam",()=>{S.mode="exam";render()});on("mode-practice",()=>{S.mode="practice";render()});
    on("go-sb",()=>startMock("sb"));on("go-p",()=>startMock("p"));
    app.querySelectorAll("[data-bd]").forEach(b=>b.addEventListener("click",()=>{S.bd=b.dataset.bd;S.btopic="";render()}));
    const sel=document.getElementById("btopic");if(sel)sel.addEventListener("change",()=>{S.btopic=sel.value;render()});
    on("ord-o",()=>{S.border="order";render()});on("src-all",()=>{S.bred=false;render()});on("src-red",()=>{S.bred=true;render()});on("ord-s",()=>{S.border="shuffle";render()});
    on("f-all",()=>{S.bfilter="all";render()});on("f-new",()=>{S.bfilter="new";render()});on("f-missed",()=>{S.bfilter="missed";render()});
    on("go-bank",startBank);on("resume",resumeBank);
    on("reset",()=>{S.confirmReset=true;render()});on("reset-no",()=>{S.confirmReset=false;render()});
    on("reset-yes",()=>{PROG={};store.set("prog-v2",{});store.del("bank-session");["sb","p"].forEach(k=>store.del("last-"+k));S.confirmReset=false;render()});
  }
  if(S.view==="quiz"){
    const instant=S.kind==="bank"||S.mode==="practice";
    const save=()=>{const f=document.getElementById("fillin");if(f&&!S.locked[S.cur])S.ans[S.cur]=f.value.trim()};
    const lock=()=>{S.locked[S.cur]=true;if(S.kind==="bank")record(S.qs[S.cur],S.ans[S.cur]);saveBank()};
    const go=i=>{save();S.cur=i;S.confirm=false;saveBank();render();window.scrollTo(0,0)};
    app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{S.ans[S.cur]=+b.dataset.o;if(instant)lock();render()}));
    const f=document.getElementById("fillin");
    const lockFill=()=>{save();if(!S.ans[S.cur])return;lock();render()};
    if(f){f.addEventListener("input",()=>{S.ans[S.cur]=f.value.trim()});f.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(instant&&!S.locked[S.cur])lockFill();else if(S.cur<S.qs.length-1)go(S.cur+1)}});if(!S.locked[S.cur])f.focus({preventScroll:true})}
    on("check",lockFill);
    on("prev",()=>go(S.cur-1));on("next",()=>go(S.cur+1));
    on("flag",()=>{save();S.flag[S.cur]=!S.flag[S.cur];render()});
    const ask=()=>{save();S.confirm=true;render();document.getElementById("yes")?.focus()};
    on("submit",ask);on("submit2",ask);on("yes",()=>{save();finish()});on("no",()=>{S.confirm=false;render()});
    on("quit",()=>{clearInterval(timerId);save();saveBank();S.view="home";render();window.scrollTo(0,0)});
    app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{S.gridOpen=true;go(+b.dataset.go)}));
    const gb=document.getElementById("gridbox");if(gb)gb.addEventListener("toggle",()=>{S.gridOpen=gb.open});
  }
  if(S.view==="results"){
    on("again",()=>startMock(S.paper));
    on("retry",()=>{const wrong=S.qs.filter((q,i)=>S.locked[i]&&!isRight(q,S.ans[i]));if(!wrong.length){S.view="home";render();return}
      const qs=shuffle(wrong).map(x=>inst(Q[x.d].find(y=>y.id===x.id)));
      S={...S,view:"quiz",kind:"bank",qs,ans:qs.map(()=>null),flag:qs.map(()=>false),locked:qs.map(()=>false),cur:0,confirm:false};saveBank();render();window.scrollTo(0,0)});
    on("menu",()=>{S.view="home";render();window.scrollTo(0,0)});
    on("rw",()=>{S.reviewWrong=true;render()});on("ra",()=>{S.reviewWrong=false;render()});
  }
}
render();
</script>
</body>
</html>
