<title>Cuesports Referee Mock Exams</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single centred column; home = mock papers + question bank; quiz = one question per screen with sticky scoreboard bar */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18221d; --muted:#5d6a63; --line:#d9e0db;
  --baize:#1d6a4b; --baize-soft:#e2efe8; --chalk:#2b67a3; --chalk-soft:#e3ecf6;
  --good:#1e7a3c; --good-soft:#e1f2e6; --bad:#b3261e; --bad-soft:#f9e3e1; --warn:#a46200;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18201c; --ink:#e6ece8; --muted:#9aa8a0; --line:#2b3631;
  --baize:#4fbf8a; --baize-soft:#183327; --chalk:#7fb2e6; --chalk-soft:#172a3d;
  --good:#5cc983; --good-soft:#163222; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#e3a54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201c; --ink:#e6ece8; --muted:#9aa8a0; --line:#2b3631;
  --baize:#4fbf8a; --baize-soft:#183327; --chalk:#7fb2e6; --chalk-soft:#172a3d;
  --good:#5cc983; --good-soft:#163222; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#e3a54a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2.1rem;line-height:1.05}
h2{font-size:1.5rem}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{color:var(--muted);margin:.4rem 0 0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
section.block{display:flex;flex-direction:column;gap:14px;padding-top:18px;border-top:1px solid var(--line)}
button,select{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--baize);border-color:var(--baize);color:var(--surface)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 8px;border-radius:8px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--baize);background:var(--baize-soft);color:var(--baize)}
.papers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.paper{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
@media (hover:hover){.paper:hover{border-color:var(--baize)}.opt:not(:disabled):hover{border-color:var(--chalk)}.btn:not(:disabled):hover{border-color:var(--baize)}}
.paper.pick[aria-pressed="true"]{border-color:var(--baize);background:var(--baize-soft)}
.paper.pick[aria-pressed="true"] .t{color:var(--baize)}
.last{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.paper .t{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.paper .m{color:var(--muted);font-size:.9rem}
.paper .last{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.lbl{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.prog-row{display:grid;grid-template-columns:8.5rem 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.prog-row .bar2{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.prog-row .bar2 i{display:block;height:100%}
.prog-row .bar2 .g{background:var(--good)} .prog-row .bar2 .r{background:var(--bad)}
.prog-row .num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
/* quiz bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:16px}
.bar-in{display:flex;align-items:center;gap:12px;justify-content:space-between}
.timer{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--baize);width:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.tag.S{background:var(--baize-soft);color:var(--baize)}
.tag.B{background:var(--chalk-soft);color:var(--chalk)}
.tag.P{background:var(--bad-soft);color:var(--bad)}
.tag.t{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.red{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.qnum{font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.qtext{font-size:1.15rem;font-weight:600;margin:10px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px;border-radius:8px}
.opt .k{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);min-width:1.2em}
.opt[aria-pressed="true"]{border-color:var(--chalk);background:var(--chalk-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fill{display:flex;gap:8px;flex-wrap:wrap}
.fill input{flex:1 1 200px;min-width:0;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.explain{margin-top:12px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.flag[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:8px}
.grid button{font-family:var(--f-mono);font-size:.78rem;padding:6px 0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px}
.grid button.done{background:var(--chalk-soft);color:var(--chalk);border-color:var(--chalk)}
.grid button.cur{outline:2px solid var(--ink)}
.grid button.fl{border-color:var(--warn);color:var(--warn)}
.grid button.r{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.grid button.w{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.grid .sec{grid-column:1/-1;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
.confirm{border:1px solid var(--warn);background:var(--surface);border-radius:10px;padding:14px;margin-top:14px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.score{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px}
.score .n{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .n small{font-size:1.1rem;color:var(--muted)}
.pill{display:inline-block;font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:999px;margin-top:6px}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.rev{border-left:3px solid var(--line);padding:8px 0 8px 12px}
.rev.ok{border-left-color:var(--good)} .rev.no{border-left-color:var(--bad)}
.rev p{margin:.2rem 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}.prog-row{grid-template-columns:6.5rem 1fr auto}}
/* device tuning: phones (touch), tablets, desktop */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,input,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.seg button,.opt,select{min-height:44px}
@media (pointer:coarse){.grid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}.grid button{min-height:40px;font-size:.85rem}.opt{padding:14px 12px}}
.home{display:flex;flex-direction:column;gap:22px}
@media (min-width:1000px){
  .wrap.wide{max-width:1120px}
  .home{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;row-gap:22px;align-items:start}
  .home>header,.home>#sec-prog{grid-column:1/-1}
  .home section.block{min-width:0}
  .wrap{max-width:780px}
  body{font-size:17px}
  .qtext{font-size:1.3rem}
}
@media (min-width:1000px) and (hover:hover){.kbd-hint{display:block}}
.kbd-hint{display:none;margin-top:14px;font-size:.8rem;color:var(--muted)}
.kbd-hint kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .2s}}
</style>
</head>

re on and the striker fails to declare. Penalty?", ["7 points", "4 points", "Value of the ball on", "No penalty, just a warning"], "\u00a72.12 (b) / \u00a73.11 (d)(v) \u2014 failing to declare when requested is a seven-point foul."], ["Which statement about snookers is correct?", ["The cue-ball cannot be snookered by a cushion", "A cushion can snooker the cue-ball", "A ball on can snooker the cue-ball", "Snookers only count when Reds are on"], "\u00a72.17 (d, e) \u2014 the cue-ball cannot be snookered by a cushion."], ["During a consultation period, the non-striker touches a ball on the table. Penalty?", ["7 points to the opponent", "4 points", "No penalty, the non-striker is not in play", "Value of the ball touched"], "\u00a72.22 / \u00a73.11 (f) \u2014 touching any ball during a consultation period is seven points, for either player."], ["What is the difference between a foul and a penalty?", ["A penalty does not affect the order of play", "A penalty always costs 7 points", "A foul does not end the turn", "There is no difference"], "\u00a72.15 \u2014 a foul ends the offender's turn; a penalty does not affect the order of play."], ["A Red has been spotted in error and cannot be identified. What happens?", ["The frame continues with a sixteenth Red", "The frame is re-started", "A Red is removed at random", "The striker chooses a Red to remove"], "\u00a73.7 (d) \u2014 if not identifiable, the frame continues with a sixteenth Red."], ["A colour was wrongly spotted after being potted in ascending order. It is discovered before being potted again. What happens?", ["It is removed from the table without penalty and play continues", "It is a foul on the striker", "The frame is re-started", "It stays on the table until potted"], "\u00a73.7 (b) \u2014 a colour spotted in error after being potted in ascending order is removed without penalty."], ["A ball on the edge of a pocket falls in by itself, not as part of any stroke. Decision?", ["It is replaced and any points scored count", "It counts as potted", "It is a foul on the striker", "It is spotted on its own spot"], "\u00a73.9 (a) \u2014 replaced, and any points scored shall count."], ["A ball balances momentarily on the pocket edge, then falls in as a result of the stroke. Decision?", ["It is considered potted or pocketed and not replaced", "It is replaced", "The stroke is replayed", "It is a foul"], "\u00a73.9 (c) \u2014 balancing momentarily then falling in = potted or pocketed, not replaced."], ["A striker commits two fouls in the same stroke. Which penalty applies?", ["The highest value penalty", "Both penalties added together", "The first foul's penalty", "Seven points automatically"], "\u00a73.10 (g) \u2014 if more than one foul is committed in a stroke, the highest value penalty is incurred."], ["Red is the ball on and the cue-ball goes in-off. Penalty?", ["4 points", "1 point", "7 points", "5 points"], "\u00a73.11 (a)(vii) \u2014 four points, or the ball on if higher. Red = 1, so 4."], ["Red is the ball on. The striker hits a Red but also pots the Pink. Penalty?", ["6 points", "4 points", "1 point", "7 points"], "\u00a73.11 (b)(iii) \u2014 value of the ball on or the ball concerned, whichever is higher, minimum four. Pink = 6."], ["Red is the ball on and the striker makes a push stroke. Penalty?", ["4 points", "1 point", "7 points", "No penalty if a Red is potted"], "\u00a73.11 (b)(v) \u2014 value of ball on or ball concerned, minimum four."], ["Blue is the ball on and the striker plays a jump shot. Penalty?", ["5 points", "4 points", "7 points", "6 points"], "\u00a73.11 (a)(x) \u2014 four points, or the ball on if higher. Blue = 5."], ["The striker uses a ball off the table to judge a gap. Penalty?", ["7 points", "4 points", "Value of the ball on", "Warning only"], "\u00a73.11 (d)(i) \u2014 using a ball off the table for any purpose is seven points."], ["When does the referee call FREE BALL?", ["After a foul, if the cue-ball is snookered", "After any foul", "When the striker  original position is a FOUL AND A MISS regardless of the difference in scores."], ["When can a frame NOT be awarded under the miss rule?", ["When a Warning has not been issued", "When fewer than 3 misses have occurred", "When Reds are still on the table", "When the scores are level"], "\u00a73.14 (d)(ii) \u2014 a frame cannot be awarded if a Warning has not been issued."], ["After a FOUL AND A MISS, the non-offender asks the offender to play from the position left. What happens to the miss sequence?", ["The sequence ends", "It continues", "The Warning stays in force", "The frame is awarded"], "\u00a73.14 (d)(iii) \u2014 if asked to play from the position left, the sequence ends."], ["For Reds, what counts as a clear ball for the miss rule?", ["The full diameter of any Red not obstructed by a colour", "Any part of any Red", "Half a Red", "Both edges of every Red"], "\u00a73.14 (d) \u2014 in the case of Reds, a full diameter of any Red that is not obstructed by a colour."], ["Balls have been replaced after a miss. Before playing a stroke, the striker touches the cue-ball with their sleeve. Decision?", ["FOUL \u2014 a miss will not be called; the appropriate penalty applies", "FOUL AND A MISS", "No foul, the balls are replaced again", "Award the frame"], "\u00a73.14 (e) \u2014 if a stroke has not been played, a MISS will not be called; the appropriate penalty may be imposed."], ["Balls have been replaced during a miss sequence and the striker fouls before playing a stroke. When does the Warning about awarding the frame stay in effect?", ["Only when all balls are replaced to their original position", "Always", "Never", "Only if the offender is asked to play from the position left"], "\u00a73.14 (e) \u2014 the Warning remains in effect only when all balls have been replaced to their original position."], ["When does a consultation period start after a FOUL AND A MISS?", ["When a request is made to play from the original position", "Immediately after the call", "When the offender asks", "After the referee replaces the balls"], "\u00a73.14 (f) \u2014 if the request is to play from the original position, a consultation period starts."], ["A spectator knocks a ball. What does the referee do?", ["Replace it where it was or would have come to rest, no penalty", "Call FOUL on the striker", "Re-rack the frame", "Leave it where it stopped"], "\u00a73.15 \u2014 a ball disturbed other than by the striker is replaced without penalising the striker."], ["A ball moves because of a defect in the table surface (not a freshly spotted ball). Is it replaced?", ["No \u2014 the ball-moved-by-other rule does not cover table defects", "Yes, always", "Yes, and the striker gets a free ball", "Only if it enters a pocket"], "\u00a73.15 (a) \u2014 it does not apply where a ball moves due to a defect in the table surface (except a spotted ball before the next stroke)."], ["The striker intentionally picks up a ball from the playing area. Call?", ["FOUL", "PENALTY", "Warning", "No call"], "\u00a73.16 \u2014 a ball intentionally moved or picked up by the striker is a FOUL."], ["The referee thinks a stalemate is approaching. A player objects to a re-rack. What then?", ["Play continues; the situation must change within a stated period, usually three more strokes each", "The frame is re-racked anyway", "The frame is awarded", "Play continues with no limit"], "\u00a73.17 (a)\u2013(b) \u2014 the situation must change within a stated period, usually three more strokes each side."], ["A stalemate occurs during a re-spotted Black. What happens?", ["Only the Black is spotted, with the same player making the opening stroke", "Full re-rack", "The frame is drawn", "The other player breaks"], "\u00a73.17 (d) \u2014 only the Black is spotted, same player to make the opening stroke."], ["A rest normally found at the table, provided by the referee, proves faulty and causes the striker to touch a ball. Decision?", ["Not a foul \u2014 the equipment is not the striker's responsibility", "Foul \u2014 4 points", "Foul \u2014 value of the ball touched", "Penalty \u2014 turn continues"], "\u00a73.20 (b) \u2014 balls are repositioned and the striker continues the break."], ["A player uses offensive language for the first time. What should the referee do first?", ["Warn the player that further Unsporting Conduct will award the frame", "Award the frame", "Award the game", "Ignore it"], "\u00a74.1 (a) \u2014 first step is to Warn the player."], ["Conduct is, in the referee's opinion, sufficiently serious and there has been no Warning. Decision?", ["The referee may award the frame or the game", "A Warning must be given first", "Only a frame can be awarded", "Refer it to the tournament director"], "\u00a74.1 (d) \u2014 sufficiently serious conduct: award the frame or the game even with no previous Warning."], ["A player offers to concede. When is the concession null and void?", ["If the opponent chooses to play on", "If the referee disagrees", "After 30 seconds", "Never"], "\u00a74.2 (a) \u2014 a concession becomes null and void if the opponent chooses to play on."], ["When may a player concede a frame in snooker?", ["Only when a player \u2014 either one \u2014 requires penalty points (snookers)", "At any time", "Only when they are behind", "Only with the referee's permission"], "\u00a74.2 (b) \u2014 'A player shall not concede a frame \u2026 unless any player requires penalty points.' Conceding when nobody needs snookers is Unsporting Conduct."], ["In an aggregate-score match, a frame is conceded. How are the remaining Reds valued?", ["8 points each", "1 point each", "7 points each", "Not counted"], "\u00a74.2 (f) \u2014 Reds count as 8 points each."], ["What must the non-striker avoid while the striker is playing?", ["Standing or moving in the line of sight of the striker", "Chalking their cue", "Sitting down", "Watching the table"], "\u00a74.5 \u2014 avoid standing or moving in the line of sight of the striker."], ["Which question must the referee NOT answer?", ["The difference in scores", "What colour a ball is", "Whether the cue-ball is touching a ball", "Whether the cue-ball is properly placed in the \"D\""], "\u00a75.1 (b)(iv) \u2014 never answer any question regarding the difference in scores."], ["The referee calls TOUCHING BALL. What must the striker do?", ["Play away from the touching ball without moving it", "Play directly at the touching ball", "Ask for the balls to be re-spotted", "Take the cue-ball in hand"], "\u00a73.8 (b) \u2014 play away without moving it, or it is a push stroke."], ["The cue-ball is in hand and the striker disturbs an object ball while placing it. Decision?", ["FOUL; the cue-ball remains in-hand for the next stroke", "No foul, replace the ball", "FOUL; next player plays from where the cue-ball lies", "PENALTY; striker continues"], "\u00a73.10 (j) \u2014 call FOUL and the cue-ball remains in-hand for the next stroke."], ["Viewed from the Baulk end, which spot is on the left-hand corner of the \"D\"?", ["Green", "Yellow", "Brown", "Pink"], "\u00a71.1 (f) \u2014 left-hand corner is the Green Spot."], ["Where is the Blue Spot?", ["Midway between the Top and Bottom Cushion faces", "Midway between the Pink and the Top Cushion", "Middle of the Baulk-line", "12\u00be in from the Top Cushion"], "\u00a71.1 (f) \u2014 Blue is midway between the faces of the Top and Bottom Cushions."], ["Which spot does NOT lie on the centre longitudinal line?", ["Yellow", "Brown", "Blue", "Pink"], "\u00a71.1 \u2014 Brown, Blue, Pink and Black lie on the centre line; Yellow and Green are on the corners of the \"D\"."], ["What is the diameter of a snooker ball?", ["52.5 mm (\u00b1 0.05 mm)", "50.8 mm", "57.2 mm", "52.5 mm (\u00b1 0.5 mm)"], "\u00a71.2 \u2014 52.5 mm, tolerance \u00b1 0.05 mm."], ["What is the minimum length of a snooker cue?", ["3 ft (914 mm)", "4 ft (1219 mm)", "3 ft 6 in", "No minimum"], "\u00a71.3 \u2014 at least 3 ft (914 mm)."], ["When may a striker claim the frame?", ["Black is the only object ball left, aggregate not relevant, and they lead by more than seven", "They lead by more than seven at any time", "All Reds are gone and they lead", "Pink and Black remain and they lead by 13"], "\u00a72.1 (b) \u2014 Black the only object ball left and the striker leads by more than seven."], ["Which is NOT required for a stroke to be completed?", ["The opponent has stood up", "All balls have come to rest", "Any required spotting is done", "Ancillary equipment has been removed"], "\u00a72.6 (d) \u2014 balls at rest, spotting completed, ancillary equipment removed."], ["How does a striker nominate a ball?", ["By indicating it to the satisfaction of the referee, or declaring it verbally", "Only by touching it with the cue", "Only in writing", "By pointing at the pocket"], "\u00a72.12 \u2014 indicates to the satisfaction of the referee, or declares (states verbally)."], ["A ball's position is marked so it can be cleaned. What is the marking device worth?", ["It acquires the value of the ball until the ball is replaced", "Nothing", "Seven points", "One point"], "\u00a73.2 (c)(ii) \u2014 the device acquires the value of the ball until it is replaced."], ["The non-striker comes to the table out of turn and moves a ball. Call?", ["PENALTY \u2014 balls replaced and the striker's turn continues", "FOUL \u2014 striker's turn ends", "FOUL AND A MISS", "No call"], "\u00a73.3 (k) \u2014 call PENALTY, replace ball(s), striker's turn continues; a consultation period starts."], ["In a break, the striker plays before the referee has finished spotting the colour just potted (not a free ball). Decision?", ["The value of that colour is not scored, and a foul is called", "No penalty", "Only a warning", "The colour scores and play continues"], "\u00a73.3 (h)(iv) / \u00a73.11 (b)(ii) \u2014 the colour's value is not scored and the foul penalty applies."], ["Yellow is the ball on and the cue-ball hits the Yellow and the Pink simultaneously. Penalty?", ["6 points", "4 points", "2 points", "No foul"], "\u00a73.11 (c) \u2014 value of the ball on or the higher of the two balls: Pink 6."], ["A colour's own spot is occupied. Where is it spotted?", ["On the highest value spot available", "On the lowest value spot available", "As near its own spot as possible", "On the Brown spot"], "\u00a73.7 (e) \u2014 on the highest value spot available."], ["The Pink must be spotted, all spots are occupied and there is no space near its spot. Where?", ["As near its spot as possible on the centre line, not touching another ball", "Touching the nearest ball", "On the Black Spot", "It stays off the table"], "\u00a73.7 \u2014 Pink/Black: as near its spot as possible on the centre longitudinal line, must not touch another ball."], ["After a Red is potted, the cue-ball comes to rest touching two colours. What does the referee do?", ["Calls TOUCHING BALL and asks the striker to DECLARE which colour they are on", "Calls FOUL", "Re-spots the colours", "Nominates the colour for them"], "\u00a73.8 (a) \u2014 ask the striker to DECLARE which colour they are on."], ["A touching ball moves at the moment of striking, but the referee is satisfied the striker did not cause it. Decision?", ["Not a foul", "Push stroke foul", "Foul \u2014 value of the ball", "Replay"], "\u00a73.8 (f) \u2014 not a foul if the referee is satisfied the movement was not caused by the striker."], ["A ball falls into the pocket during a stroke, just before it would have been hit; no infringement. Decision?", ["All balls replaced; the same stroke or a different one played at the striker's discretion", "The ball counts as potted", "Foul on the striker", "Only that ball is replaced"], "\u00a73.9 (b)(i) \u2014 all balls replaced and the stroke played again (same or different)."], ["The striker has made 40 points in a break, then fouls. What happens to the 40 points?", ["They count; no points are scored for balls pocketed in the foul stroke", "They are lost", "Half count", "They go to the opponent"], "\u00a73.10 (e) \u2014 points scored before the foul count; no points for balls pocketed in the foul stroke."], ["A colour is not correctly spotted and later forced off the table. How is it spotted?", ["Correctly, on its proper spot", "Where it was wrongly placed", "It stays off", "The referee decides"], "\u00a73.10 (d) \u2014 a colour not correctly spotted stays where positioned, except that if off the table it is correctly spotted."], ["The striker fouls a ball before striking the cue-ball. What may the non-offender do?", ["Play from the position left, or ask the offender to play again from the position left or the original position", "Only play from the position left", "Only take a free ball", "Claim the frame"], "\u00a73.10 (i) \u2014 those three options."], ["Brown is the ball on and the striker strikes with both feet off the floor. Penalty?", ["4 points", "7 points", "5 points", "Warning"], "\u00a73.11 (a)(iii) \u2014 four points, or the ball on if higher. Brown = 4."], ["Black is the ball on and the cue-ball misses every ball. Penalty?", ["7 points", "4 points", "No penalty", "5 points"], "\u00a73.11 (a)(vi) \u2014 four points or the ball on if higher: Black = 7."], ["Red is the ball on and the cue-ball hits the Blue first. Penalty?", ["5 points", "4 points", "1 point", "7 points"], "\u00a73.11 (b)(iv) \u2014 value of ball on or ball concerned, minimum four: Blue = 5."], ["Red is the ball on and the striker forces the Black off the table. Penalty?", ["7 points", "4 points", "1 point", "No penalty"], "\u00a73.11 (b)(x) \u2014 value of the ball concerned, Black = 7."], ["The striker plays at Reds in two successive strokes. Penalty?", ["7 points", "4 points", "1 point", "Value of the ball on"], "\u00a73.11 (d)(iii) \u2014 playing at Reds in successive strokes is seven points."], ["After potting a Red, the striker commits a foul before a colour has been nominated. Penalty?", ["7 points", "4 points", "Value of the ball fouled", "1 point"], "\u00a73.11 (d)(vi) \u2014 sev all: The Head String bounds which part of the table?", ["The quarter closest to the Head Rail", "The half closest to the Head Rail", "The area around the side pockets", "The quarter closest to the Foot Rail"], "\u00a72.1 (b)."], ["8, 9 & 10-Ball: What lies between the two side pockets?", ["The Centre String", "The Head String", "The Long String", "The Foot String"], "\u00a72.1 (d)."], ["8, 9 & 10-Ball: Is the Head String itself part of the area \"above the Head String\"?", ["No", "Yes", "Only for the 8-Ball break", "Only for the lag"], "\u00a72.1 \u2014 above the Head String is between the Head Rail and the Head String, not including the string."], ["8, 9 & 10-Ball: What do the diamonds on the rails mark?", ["\u00bc of the width and \u215b of the length, nose to nose", "Every 6 inches", "The pocket centres", "The strings only"], "\u00a72.1."], ["8, 9 & 10-Ball: Which are parts of the rails?", ["Cushions, rail tops, pockets and pocket liners", "Only the cushions", "Only the rail tops", "The playing surface edge"], "\u00a72.1."], ["8, 9 & 10-Ball: Which end of the table do the object balls usually begin at?", ["The foot end", "The head end", "The side", "Centre"], "\u00a72.1."], ["8, 9 & 10-Ball: When is a ball pocketed?", ["When it comes to rest in a pocket below the playing surface or enters the ball return", "When it touches the pocket liner", "When it drops below the cushion nose", "When it is in the jaws"], "\u00a72.2."], ["8, 9 & 10-Ball: Two balls are jammed in the jaws of a pocket, one supporting the other. How is the hanging ball treated?", ["Pocketed, if removing the supporting ball would make it fall", "Not pocketed", "Re-spotted", "Replayed"], "\u00a72.2."], ["8, 9 & 10-Ball: What happens to play while the five-second count on a hanging ball runs?", ["Play is suspended", "Play continues", "The next shot may be taken", "The shot clock runs"], "\u00a72.2."], ["8, 9 & 10-Ball: Who is ultimately responsible for making sure full pockets are cleared?", ["The shooter", "The referee", "The opponent", "The table attendant"], "\u00a72.2 / Reg 13."], ["8, 9 & 10-Ball: The cue-ball hits a light fitting and drops back on the table. Decision?", ["Driven off the table \u2014 foul", "No foul", "Replay", "Restore and continue"], "\u00a72.6."], ["8, 9 & 10-Ball: A ball touching a rail at the start of a shot is hit and stays on the rail. Has it been driven to that rail?", ["No \u2014 it must leave the rail and return", "Yes", "Only if it moves", "Only in 8-Ball"], "\u00a72.7."], ["8, 9 & 10-Ball: For the rail requirement, a pocketed ball counts as\u2026", ["Driven to a rail", "Not driven to a rail", "Only counts in 9-Ball", "Only if it hit a cushion first"], "\u00a72.7."], ["8, 9 & 10-Ball: What is an inning?", ["A player's turn at the table", "One rack", "One shot", "One set"], "\u00a72.8."], ["8, 9 & 10-Ball: Which is a legal way to play a jump shot?", ["Elevating the cue and driving the cue-ball down into the surface so it rebounds", "Scooping under the cue-ball", "Hitting the cue-ball low with a level cue", "Pushing through the ball"], "\u00a72.9."], ["8, 9 & 10-Ball: How is a miscue usually evidenced?", ["A sharp sound and discoloration of the tip", "A double hit", "The cue-ball jumping", "Chalk on the cloth"], "\u00a72.11."], ["8, 9 & 10-Ball: The side of the cue-stick may have touched the cue-ball during a miscue, but it wasn't clearly seen. Decision?", ["Assumed not to have occurred \u2014 legal", "Foul", "Replay", "Referee asks the players"], "\u00a72.11."], ["8, 9 & 10-Ball: An unintentional miscue makes the cue-ball jump over a ball. Decision?", ["Treated like a legal jump shot", "Foul", "Unsportsmanlike conduct", "Replay"], "\u00a72.11."], ["8, 9 & 10-Ball: A player miscues on purpose. Decision?", ["Unsportsmanlike conduct", "Legal", "Standard foul only", "Replay"], "\u00a72.11 / \u00a73.16 (c)."], ["8, 9 & 10-Ball: How is a ball's position on the table determined?", ["The projection of its centre vertically down onto the surface", "Its contact point with the cloth edge", "Where most of the ball is", "The referee's view from above"], "\u00a72.13."], ["8, 9 & 10-Ball: When is a ball \"on\" a line or spot?", ["When its centre is directly over it", "When any part touches it", "When half the ball is over it", "When the referee says so"], "\u00a72.13."], ["8, 9 & 10-Ball: What is a scratch?", ["A shot on which the cue-ball is pocketed", "Any foul", "A miscue", "A ball off the table"], "\u00a72.17."], ["8, 9 & 10-Ball: When does a shot end?", ["When all balls in play have stopped moving and spinning", "When the cue-ball stops", "When the last object ball stops", "When the referee says"], "\u00a72.19."], ["8, 9 & 10-Ball: What is a set?", ["A part of a match, with a number of sets needed to win", "A single rack", "A group of 7 balls", "A tournament round"], "\u00a72.18."], ["8, 9 & 10-Ball: How many cue-balls are used in a rack?", ["One, shared by both players", "One per player", "Two", "Depends on the discipline"], "\u00a72.4."], ["8, 9 & 10-Ball: Several fouls happen on one shot. Which is enforced?", ["Only the most serious", "All of them", "The first one", "The last one"], "\u00a73."], ["8, 9 & 10-Ball: When should the referee call a foul?", ["Immediately when it occurs", "At the end of the shot", "At the end of the inning", "Only when claimed"], "\u00a73 slides \u2014 prompt calling."], ["8, 9 & 10-Ball: A ball is pocketed but no ball hits a rail after contact. Decision?", ["Legal \u2014 the rail requirement applies only when no ball is pocketed", "Foul", "Foul only in 9-Ball", "Replay"], "\u00a73.3."], ["8, 9 & 10-Ball: The cue-ball misses all object balls. Decision?", ["Foul", "Legal if it hits a rail", "Legal in 8-Ball", "Warning"], "\u00a73.3 \u2014 the cue-ball must contact an object ball."], ["8, 9 & 10-Ball: The cue-ball contacts the legal object ball, then the cue-ball rolls into a rail. Is the rail requirement met?", ["Yes \u2014 the cue-ball counts", "No \u2014 an object ball must reach a rail", "Only if the object ball moves 1 inch", "Only in 10-Ball"], "\u00a73.3."], ["8, 9 & 10-Ball: The legal ball is frozen to a rail. The shooter hits it softly; nothing else reaches a rail and it does not leave and return. Decision?", ["Foul \u2014 no rail after contact", "Legal", "Legal because it is on the rail", "Replay"], "\u00a73.3 / \u00a72.7."], ["8, 9 & 10-Ball: The player sits on the rail with one foot touching the floor as the tip contacts the cue-ball. Decision?", ["Legal", "Foul", "Legal only with a bridge", "Warning"], "\u00a73.4."], ["8, 9 & 10-Ball: The cue-ball is in hand. The shooter moves it with his hand onto the spot he wants. Decision?", ["Legal", "Foul", "Foul unless done with the cue", "Unsportsmanlike"], "\u00a73.6 \u2014 touching the cue-ball is allowed when it is in hand."], ["8, 9 & 10-Ball: A player's hair brushes an object ball, moving it slightly. Decision?", ["Foul \u2014 the shooter is responsible for his hair", "No foul", "Replace and continue", "Warning"], "\u00a73.6."], ["8, 9 & 10-Ball: The shooter's bridge accidentally moves an object ball. Decision?", ["Standard foul", "Unsportsmanlike conduct", "No foul", "Replace and replay"], "\u00a73.6."], ["8, 9 & 10-Ball: The cue-ball is close to (not touching) an object ball, and the tip is still on the cue-ball when it hits the object ball. Decision?", ["Foul", "Legal", "Legal if the object ball is pocketed", "Replay"], "\u00a73.7."], ["8, 9 & 10-Ball: Who must get the declaration that the cue-ball is touching a ball, before the shot?", ["The shooter", "The opponent", "The referee, unprompted", "Nobody"], "\u00a73.7."], ["8, 9 & 10-Ball: What is a push shot?", ["Prolonging tip-to-cue-ball contact beyond a normal shot", "A shot with no follow", "A jump shot", "Hitting the cue-ball twice"], "\u00a73.8."], ["8, 9 & 10-Ball: The shooter begins a shot while an object ball is still spinning in place. Decision?", ["Foul \u2014 balls still moving", "Legal", "Legal if it does not affect the shot", "Replay"], "\u00a73.9."], ["8, 9 & 10-Ball: For the break, the shooter places the cue-ball on the Head String line (not above it) and shoots. Decision?", ["Foul \u2014 bad cue-ball placement", "Legal", "Legal if he hits a ball first", "Replay"], "\u00a73.10. Applies in all three \u2014 every break is played from above the Head String."], ["8-Ball: After a foul on the break, the incoming player takes cue-ball in hand above the Head String. The cue-ball first contacts a ball above the string without crossing it. Decision?", ["Foul", "Legal", "Legal if the ball is legal", "Replay"], "\u00a73.11. Only arises in 8-Ball: after a foul on the break the incoming player may take cue-ball in hand above the Head String (\u00a74.3 g\u2013h). In 9-Ball and 10-Ball, ball in hand after a foul is anywhere."], ["8-Ball: After a foul on the break, the incoming player takes cue-ball in hand above the Head String. The cue-ball crosses the string, comes back and hits a ball above the string. Decision?", ["Legal", "Foul", "Foul unless the ball is a solid", "Unsportsmanlike"], "\u00a73.11 \u2014 the foul applies unless the cue-ball crosses the Head String before that contact. Only arises in 8-Ball: after a foul on the break the incoming player may take cue-ball in hand above the Head String (\u00a74.3 g\u2013h). In 9-Ball and 10-Ball, ball in hand after a foul is anywhere."], ["8, 9 & 10-Ball: A player unintentionally plays out of turn. What happens?", ["Standard foul; balls normally played from the position left", "Balls restored; replay", "Loss of rack", "No foul"], "\u00a73.12."], ["For the three-foul rule in 9-Ball, must the fouls be in the same rack?", ["Yes", "No", "Only in sets", "Only on the break"], "\u00a73.13."], ["A player has fouled twice in a row in 9-Ball. When must the referee warn him?", ["When he comes to the table", "Only after the third foul", "Never", "At the next rack"], "\u00a73.13."], ["9-Ball / 10-Ball: What breaks a three-foul sequence?", ["An intervening legal shot", "A new set", "A time out", "A safety"], "\u00a73.13."], ["8, 9 & 10-Ball: The shooter exceeds the shot clock. Decision?", ["Standard foul", "Loss of rack", "Warning", "No penalty first time"], "\u00a73.14 / Reg 18."], ["8, 9 & 10-Ball: A rack template left lying on the rail is touched by a ball. Decision?", ["Foul", "No foul", "Replay", "Stalemate"], "\u00a73.15."], ["8, 9 & 10-Ball: What is the normal penalty for unsportsmanlike conduct?", ["The same as for a serious foul", "A warning", "A standard foul", "Loss of match"], "\u00a73.16."], ["8, 9 & 10-Ball: Which best defines unsportsmanlike conduct?", ["Intentional behaviour that brings disrepute or prevents fair play", "Any foul", "Arguing with the opponent", "Slow play"], "\u00a73.16."], ["8, 9 & 10-Ball: A player practises shots on the table during his match. This is\u2026", ["Unsportsmanlike conduct", "Allowed between racks", "A standard foul only", "Allowed if the opponent agrees"], "\u00a73.16 (e)."], ["8, 9 & 10-Ball: A player marks the cloth with chalk to aim. This is\u2026", ["Unsportsmanlike conduct (marking the table)", "Legal", "A standard foul", "Allowed if removed after"], "\u00a73.16 (f)."], ["8, 9 & 10-Ball: A player keeps shooting after the referee has called a foul. This is\u2026", ["Unsportsmanlike conduct", "Legal", "A standard foul only", "Ignored"], "\u00a73.16 (d)."], ["9-Ball / 10-Ball: A referee gives a standard-foul penalty for unsportsmanlike conduct. Does it count toward three fouls?", ["Yes, where applicable", "No", "Only in 8-Ball", "Only if it is the second"], "\u00a73.16."], ["8, 9 & 10-Ball: Which extra sanction may come with ejection for unsportsmanlike conduct?", ["Forfeiture of prizes, trophies and standings points", "A fine set by the referee", "A ban from the venue", "Nothing extra"], "\u00a73.16."], ["8, 9 & 10-Ball: A player miscues on the break and stops the cue-ball with his cue. This is\u2026", ["Unsportsmanlike conduct", "Legal", "A standard foul only", "A re-break"], "Reg 17."], ["How many object balls are used in 8-Ball?", ["15", "9", "10", "16"], "\u00a74."], ["What are the two groups in 8-Ball?", ["1\u20137 and 9\u201315", "1\u20138 and 9\u201315", "Odds and evens", "1\u20137 and 8\u201315"], "\u00a74."], ["In 8-Ball, what must a shooter do before attempting the 8-ball?", ["Pocket all seven balls of his group", "Pocket at least five of his group", "Call safety", "Pocket one ball of each group"], "\u00a74."], ["Is a \"J\" pattern required in the 8-Ball rack?", ["No", "Yes", "Only in world events", "Reverse J only"], "Slides \u00a74.2 \u2014 balls other than the apex, 8 and corners are placed without pattern."], ["In 8-Ball, where is the 8-ball in the rack?", ["The first ball directly below the apex ball", "At the apex", "In the back row centre", "Any position"], "\u00a74.2."], ["On the 8-Ball break, must the breaker call a ball?", ["No \u2014 no ball is called and any ball may be hit first", "Yes", "Only the 8", "Only if the table is open"], "\u00a74.3 (b)."], ["8-Ball: The breaker legally pockets a stripe on the break. Are stripes now his group?", ["No \u2014 the table remains open", "Yes", "Yes, if only stripes went in", "The opponent chooses"], "\u00a74.3 (c)."], ["8-Ball break: no ball pocketed and only three balls reach a rail. Decision?", ["Illegal break", "Legal break", "Foul \u2014 ball in hand anywhere", "Loss of rack"], "\u00a74.3 (d) \u2014 at least four must be driven to a rail."], ["8-Ball break: nothing pocketed, five balls reach rails, cue-ball stays on the table. Decision?", ["Legal break; play passes to the opponent", "Illegal break", "Foul", "Re-rack"], "\u00a74.3 (d)."], ["8-Ball break: the breaker scratches (the 8 does not drop). What does the incoming player get?", ["Cue-ball in hand above the Head String", "Cue-ball in hand anywhere", "Re-rack and break", "Loss of rack for the breaker"], "\u00a74.3 (h). The rule's other option, 'accept the table in position', has no use after a scratch, because the cue-ball is in the pocket. It matters for other break fouls, where the cue-ball stays on the table."], ["8-Ball break: the 8-ball is driven off the table. Decision?", ["Foul; the 8 is spotted; incoming player accepts or takes cue-ball in hand above the Head String", "Loss of rack", "Re-rack", "No foul, 8 spotted"], "\u00a74.3 (g) / \u00a74.7."], ["8-Ball: a solid is driven off the table on the break. What happens to it?", ["It stays off the table (out of play)", "It is spotted on the Foot Spot", "It is returned to where it left the table", "Re-rack"], "\u00a74.3 (g) \u2014 an object ball driven off the table on the break is not spotted (only the 8 ever is). It is a foul; the incoming player may accept the table or take cue-ball in hand above the Head String."], ["8-Ball, open table: the shooter calls the 3, hits a stripe first, and the 3 goes in as called. Decision?", ["Legal \u2014 solids become his group", "Foul \u2014 wrong ball first", "Legal but the table stays open", "Loss of turn"], "\u00a74.4 \u2014 on an open table any ball except the 8 may be hit first."], ["8-Ball, open table: the shooter calls a ball but misses it. Decision?", ["The table remains open and play passes", "He is assigned that group", "Foul", "Ball in hand"], "\u00a74.4."], ["8-Ball: When does a group become a player's group?", ["When he legally pockets his called ball", "When he pockets any ball on the break", "When he hits it first", "When he chooses"], "\u00a74.4."], ["8-Ball: The shooter legally pockets his called ball and a ball of the opponent's group drops too. Decision?", ["Legal \u2014 he continues; the other ball stays down", "Foul", "He loses his turn", "The opponent ball is spotted"], "\u00a74.5 / \u00a74.7 \u2014 no other object ball is ever spotted."], ["In 8-Ball, after a group is cleared, which ball is the called ball?", ["The 8-ball", "Any ball", "The opponent's lowest", "None"], "\u00a74.6."], ["An 8-Ball shooter calls safety and pockets one of his own balls. Decision?", ["The ball stays pocketed and play passes", "He continues", "The ball is spotted", "Foul"], "\u00a74.6."], ["Apart from the break, is any object ball ever spotted in 8-Ball?", ["No", "Yes, any ball driven off", "Yes, balls on a safety", "Yes, the 8 always"], "\u00a74.7."], ["8-Ball: The shooter pockets the 8 in the called pocket but scratches. Decision?", ["Loss of rack", "Win", "8 spotted, foul", "Re-rack"], "\u00a74.8 (a)."], ["8-Ball: The shooter's group is cleared. He calls the 8 in the corner but it drops in the side. Decision?", ["Loss of rack", "8 spotted, opponent's turn", "Win", "Replay"], "\u00a74.8 (c)."], ["8-Ball: The shooter drives the 8-ball off the table during play. Decision?", ["Loss of rack", "8 spotted", "Foul only", "Re-rack"], "\u00a74.8 (d)."], ["8-Ball: The shooter has two of his group left and pockets the 8 by accident. Decision?", ["Loss of rack", "8 spotted", "Foul only", "Continue"], "\u00a74.8 (b)."], ["In 8-Ball, what does a standard foul give the incoming player?", ["Cue-ball in hand anywhere on the table", "Cue-ball in hand above the Head String", "A re-rack", "Two shots"], "\u00a74.9."], ["In 8-Ball, what is the penalty for the losing-the-rack fouls?", ["Loss of the current rack", "Loss of the match", "Ball in hand", "Warning"], "\u00a74.10."], ["8-Ball: groups are found to have been reversed (players shot the wrong groups). Decision?", ["The rack is halted and replayed with the original breaker", "Play continues", "The player who noticed wins", "Loss of rack"], "Reg 10."], ["8-Ball: a player pockets one of the opponent's group by mistake. When must the foul be called?", ["Before he takes his next shot", "At the end of the rack", "Any time", "After two shots"], "Reg 10."], ["8-Ball: the table is open and all stripes are already pocketed. The shooter may\u2026", ["Temporarily claim stripes and shoot the 8-ball", "Not shoot the 8", "Choose solids only", "Re-rack"], "\u00a74.4 exception."], ["8-Ball: which standard foul in the \u00a73 list does NOT apply?", ["Three Consecutive Fouls", "Playing out of Turn", "Ball Rack Template Foul", "Slow Play"], "\u00a74.9 \u2014 no three-foul rule in 8-Ball."], ["8-Ball: may a player call \"safety\"?", ["Yes", "No", "Only on an open table", "Only after the break"], "\u00a74.6."], ["How many object balls are used in 9-Ball?", ["Nine", "Ten", "Fifteen", "Eight"], "\u00a75."], ["How are the balls played in 9-Ball?", ["In ascending numerical order (first contact on the lowest ball)", "Any order", "Descending order", "Called balls only"], "\u00a75 / \u00a75.7."], ["How does a player win a 9-Ball rack?", ["By legally pocketing the 9-ball", "By pocketing the most balls", "By pocketing the 9 after all others", "By pocketing the 1 and 9"], "\u00a75."], ["9-Ball: a legal break pockets the 9-ball. Decision?", ["The breaker wins the rack", "9 spotted", "Foul", "Re-rack"], "\u00a75.5 \u2014 legally pocketing the 9 on any shot except a push out wins."], ["9-Ball break: no ball pocketed and three balls reach a rail. Decision?", ["Foul \u2014 cue-ball in hand anywhere for the opponent", "Illegal break \u2014 re-rack", "Legal", "Loss of rack"], "\u00a75.3 (b)."], ["9-Ball break: no ball pocketed, five balls hit rails, but only two cross the Head String. Decision?", ["Illegal break under the Three-Ball Rule", "Legal", "Foul", "Loss of rack"], "\u00a75.3 (c) / Reg 16."], ["9-Ball, Three-Ball Rule: one ball is pocketed and two others cross the Head String. Decision?", ["Requirement met \u2014 legal break", "Illegal break", "Foul", "Re-rack"], "Reg 16 (1)."], ["9-Ball, Three-Ball Rule: two balls are pocketed and one crosses the Head String. Decision?", ["Requirement met", "Illegal break", "Foul", "Re-rack"], "Reg 16 (1)."], ["9-Ball, Three-Ball Rule: one ball is pocketed and one crosses the Head String. Decision?", ["Illegal break \u2014 incoming player may accept or hand back", "Legal", "Foul \u2014 ball in hand", "Re-rack"], "Reg 16 (1)\u2013(2)."], ["9-Ball, Three-Ball Rule: what counts as \"crossing\" the Head String?", ["The ball's centre (or resting point) goes beyond the line", "Any part of the ball touches the line", "The ball touches the head rail", "The ball passes the side pockets"], "Reg 16 (1)."], ["9-Ball, Three-Ball Rule: the table is handed back to the breaker, who plays a push out. What then?", ["The opponent may play the shot or hand it back", "The breaker shoots again", "Foul", "Re-rack"], "Reg 16 (4)."], ["9-Ball: The break fails the Three-Ball Rule and the 9 was pocketed. What happens to the 9?", ["It is spotted before the next shot", "The breaker wins", "It stays down", "Re-rack"], "Reg 16 (5)."], ["9-Ball: on the break the cue-ball first hits the 3-ball. Decision?", ["Foul \u2014 wrong ball first (the 1 must be hit first)", "Legal \u2014 any ball on the break", "Illegal break", "Re-rack"], "\u00a73.2 / \u00a75.7 \u2014 slide scenario: wrong first contact on the break is a foul."], ["9-Ball: when may a push out be played?", ["On the shot after the break, if there was no foul on the break", "Any time", "After any foul", "Only by the breaker on the break"], "\u00a75.4."], ["9-Ball push out: which rules are suspended?", ["3.2 Wrong Ball First and 3.3 No Rail after Contact", "All fouls", "3.1 Scratch only", "3.3 only"], "\u00a75.4."], ["9-Ball: the cue-ball is pocketed on a push out. Decision?", ["Foul \u2014 cue-ball in hand for the opponent", "Legal \u2014 fouls are suspended", "Replay", "Push out void"], "\u00a75.4 \u2014 only 3.2 and 3.3 are suspended."], ["9-Ball: what must the shooter do to play a push out?", ["Make his intention known to the referee first", "Nothing", "Hit a rail", "Call the ball"], "\u00a75.4 \u2014 the referee should echo it back."], ["9-Ball: the 4-ball drops on a push out (not the 9). What happens?", ["It stays pocketed; the opponent chooses who shoots next", "It is spotted", "The shooter continues", "Foul"], "\u00a75.4 / \u00a75.6 \u2014 only the 9 is ever spotted."], ["9-Ball: the 3 is the lowest ball. The shooter hits the 3 first and the 9 drops in. Decision?", ["The shooter wins the rack", "9 spotted", "Foul", "The 9 must be called"], "\u00a75.5 \u2014 slide scenario; calls are not needed."], ["9-Ball: the shooter hits the 5 first (the 2 is lowest) and pots the 9. Decision?", ["Foul \u2014 9 spotted, ball in hand to the opponent", "Win", "9 spotted, no foul", "Re-rack"], "\u00a75.6 / \u00a75.7."], ["9-Ball: the shooter misses without fouling. How does the opponent continue?", ["Plays from the position left", "Ball in hand anywhere", "Ball in hand above the Head String", "Push out"], "\u00a75.5."], ["9-Ball: the 9 is driven off the table. Decision?", ["Foul; the 9 is spotted", "Loss of rack", "Re-rack", "9 stays out"], "\u00a75.6."], ["9-Ball: the 6 is driven off the table. What happens to it?", ["Foul; it stays off", "It is spotted", "Re-rack", "Restored"], "\u00a75.7 \u2014 only the 9 is spotted."], ["9-Ball: what is the penalty for three consecutive fouls?", ["Loss of the current rack", "Loss of match", "Ball in hand", "Warning"], "\u00a75.8."], ["9-Ball: a player fouls twice at the end of rack 4 and once at the start of rack 5. Loss of rack?", ["No \u2014 the fouls must be in a single rack", "Yes", "Yes, if he was warned", "Only in sets"], "\u00a73.13."], ["9-Ball: does the shooter need to call shots?", ["No", "Yes", "Only the 9", "Only combinations"], "\u00a75.5."], ["9-Ball racking: a player keeps placing balls in a set order. What happens?", ["Official warning, then unsportsmanlike conduct if continued", "Immediate loss of rack", "Nothing", "Re-rack only"], "Reg 15."], ["9-Ball: where is the 1-ball in the rack?", ["At the apex, towards the head of the table", "On the Foot Spot", "In the middle", "At the back"], "\u00a75.2."], ["9-Ball: after a foul on the break, may the incoming player push out?", ["No \u2014 a push out is only available if there is no foul on the break", "Yes", "Only with ball in hand", "Only under the Three-Ball Rule"], "\u00a75.4."], ["9-Ball: where does the incoming player place the cue-ball after a standard foul?", ["Anywhere on the playing surface", "Above the Head String", "In the kitchen", "Where it stopped"], "\u00a75.7."], ["How many object balls are used in 10-Ball?", ["Ten", "Nine", "Fifteen", "Eleven"], "\u00a76."], ["How does a player win a 10-Ball rack?", ["By legally pocketing the 10 on a called shot when it is the only object ball left", "By pocketing the 10 on any shot", "By pocketing the 10 on the break", "By pocketing the most balls"], "\u00a76 / \u00a76.7."], ["What shape is the 10-Ball rack?", ["Triangle", "Diamond", "Square", "Line"], "\u00a76.2."], ["10-Ball: where is the 1-ball racked?", ["At the apex, on the Foot Spot", "In the middle", "At the apex, above the Foot Spot", "On the Head Spot"], "\u00a76.2."], ["10-Ball break: no ball pocketed and three reach a rail. Decision?", ["Foul \u2014 cue-ball in hand anywhere", "Illegal break", "Legal", "Re-rack"], "\u00a76.3 (b)."], ["Does the Three-Ball Break Rule apply to 10-Ball?", ["No \u2014 it is a 9-Ball rule", "Yes", "Only in finals", "Only with a template"], "Reg 16 / slide comparison table."], ["10-Ball: is there a push out?", ["Yes, on the shot after a legal break", "No", "Only after a foul", "Only on the break"], "\u00a76.4."], ["10-Ball: the shooter calls the 2 in the corner, but it drops in the side, with no foul. Decision?", ["Wrongfully pocketed \u2014 the opponent chooses who shoots next", "Legal, continue", "Foul", "2 spotted"], "\u00a76.6."], ["10-Ball: the called ball goes in and two other balls also drop. Decision?", ["Legal; the extra balls stay down and the shooter continues", "Foul", "The extra balls are spotted", "The opponent chooses"], "\u00a76.7."], ["10-Ball: the 10 is pocketed on the break. Decision?", ["The 10 is spotted", "The breaker wins", "Foul", "Re-rack"], "\u00a76.8 \u2014 only pocketing it on the final, winning shot counts."], ["10-Ball: the 10 is driven off the table. Decision er is on the 8 and misses it completely. Decision?", ["Foul \u2014 ball in hand for the opponent", "Loss of rack", "Legal", "Re-rack"], "\u00a73.3 \u2014 not a losing foul; \u00a74.8 lists only the four losing cases."], ["8-Ball: the shooter fouls three times in a row. Decision?", ["Each is a standard foul \u2014 no loss of rack", "Loss of rack", "Loss of match", "Warning, then loss of rack"], "\u00a74.9."], ["9-Ball: the shooter pockets the 2 legally and continues. Must he call his next shot?", ["No", "Yes", "Only for the 9", "Only on combinations"], "\u00a75.5."], ["9-Ball: the shooter hits the lowest ball, nothing is pocketed, and no ball reaches a rail. Decision?", ["Foul", "Legal", "Push out", "Warning"], "\u00a73.3 / \u00a75.7."], ["9-Ball: the breaker pockets the 9 but scratches. Decision?", ["Foul; the 9 is spotted; ball in hand anywhere to the opponent", "Breaker wins", "Re-rack", "Loss of rack"], "\u00a75.6 / \u00a75.7."], ["9-Ball: a foul occurs on the push out. What does the incoming player get?", ["Cue-ball in hand anywhere", "The choice of who shoots", "A re-rack", "Nothing"], "\u00a75.4 / \u00a75.7."], ["9-Ball: after a legal push out, the incoming player passes the shot back. Who shoots?", ["The player who pushed out", "The incoming player", "Re-rack", "The breaker always"], "\u00a75.4 / \u00a72.8 \u2014 the player remaining at the table continues."], ["10-Ball: the shooter calls the 4 (lowest) in the side and makes it, and the 10 also drops. Decision?", ["The 10 is spotted and the shooter continues", "Win", "Foul", "Opponent chooses"], "\u00a76.7 / \u00a76.8."], ["10-Ball: on the break, three balls are pocketed. Does the breaker need to call anything?", ["No \u2014 and he continues", "Yes, before the break", "Only the 10", "He must call safety"], "\u00a76.5 \u2014 shots are called except the break."], ["10-Ball: The shooter calls the 1 but plays it softly as a safety; the 1 does not drop and a rail is reached. Decision?", ["Legal \u2014 play passes; nent", "Nobody"], "Reg 14."], ["8, 9 & 10-Ball (regulations): May a time out be used for coaching?", ["Yes", "No", "Only between sets", "Only with the opponent's consent"], "Reg 22."], ["8, 9 & 10-Ball (regulations): Who decides whether to use a shot clock when one is requested?", ["The tournament director or appointed official", "The requesting player", "The referee alone", "Both players together"], "Reg 18."], ["8, 9 & 10-Ball (regulations): Who may request a shot clock?", ["A tournament official or either player", "Only the referee", "Only the TD", "Only spectators"], "Reg 18."], ["8, 9 & 10-Ball (regulations): What shot clock do the WPA Regulations recommend (not local practice)?", ["35 seconds, warning at 10, one 25-second extension per rack", "45 seconds and a 45-second extension", "60 seconds", "30 seconds, no extension"], "Reg 18 \u2014 local practice on your slides is 45 s."], ["8, 9 & 10-Ball (regulations): After the opening shot, what is the maximum the time cap may be extended to?", ["60 seconds", "45 seconds", "90 seconds", "No limit"], "Reg 18."], ["8, 9 & 10-Ball (regulations): A player is late. When are the first, second and final calls recommended?", ["At 5 minutes, 10 minutes, and a final one-minute warning at 14 minutes", "At 1, 5 and 15 minutes", "At 10 minutes only", "No calls"], "Reg 20."], ["8, 9 & 10-Ball (regulations): May interference be verbal as well as physical?", ["Yes", "No \u2014 only physical", "Only from players", "Only from spectators"], "Reg 21."], ["8, 9 & 10-Ball (regulations): A coach keeps giving advice shot by shot. What may the referee do?", ["Direct the coach to stay away from the match", "Award the rack", "Ignore it", "Foul the player"], "Reg 22."], ["8, 9 & 10-Ball (regulations): A non-shooting player needs to leave the playing area. What must he do?", ["Request and receive the referee's permission", "Just go", "Tell his opponent", "Wait for the end of the set"], "Reg 24."], ["8, 9 & 10-Ball (regulations): Which balls sho <script>
/* ---------- bank prep ---------- */
const NAMES={S:"Snooker",B:"English Billiards",P:"Pool"};
const PASS={S:[38,50],B:[15,20],P:[23,30]};
const PART={S:{n:50,mins:45},B:{n:20,mins:15},P:{n:30,mins:30}}; // Snooker + Billiards = 60 min, as in the real paper
const PAPERS=new Proxy({},{get:(_,key)=>{const ds=String(key).split("").filter(d=>PART[d]);const draw={};let mins=0;ds.forEach(d=>{draw[d]=PART[d].n;mins+=PART[d].mins});return {name:ds.map(d=>NAMES[d]).join(" + "),draw,mins}}});
function selKey(){return ["S","B","P"].filter(d=>S.sel[d]).join("")}
const BFILL=0; // fill-in-the-blank questions per Billiards mock (bank is all MCQ)
const REDMIN=0.6; // at least this share of each mock tests red slide wording; the rest is a plain random draw
function draw(pool,n){let pick=shuffle(pool).slice(0,n);const need=Math.ceil(n*REDMIN)-pick.filter(x=>x.red).length;if(need>0){const extra=shuffle(pool.filter(x=>x.red&&!pick.includes(x))).slice(0,need);let k=0;pick=pick.map(x=>(!x.red&&k<extra.length)?extra[k++]:x)}return shuffle(pick)}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)}
function sec(e){const m=String(e).match(/§\s*(\d+)(?:\.(\d+))?/);return m?[+m[1],m[2]?+m[2]:0]:null}
function topicOf(d,q,e){
  const t=q.toLowerCase(),ex=String(e);
  if(d==="P"){
    if(/^comparing/i.test(q)||/comparison/i.test(ex))return "Comparing disciplines";
    if(/three-ball/.test(t))return "9-Ball";
    const pre=q.split(":")[0],multi=/^8, 9 & 10-Ball|\//.test(pre);
    const m=q.match(/\b(8|9|10)-Ball\b/); if(m&&!multi&&!/disciplines|which discipline/i.test(q))return m[1]+"-Ball";
    if(/reg/i.test(ex.split("—")[0])||/^Reg/.test(ex))return "Regulations";
    const s=sec(ex); if(!s)return "General rules";
    return {1:"General rules",2:"Definitions",3:"Fouls",4:"8-Ball",5:"9-Ball",6:"10-Ball"}[s[0]]||"General rules";
  }
  const s=sec(ex);
  if(d==="S"){
    if(!s)return /value/i.test(ex)?"Equipment & ball values":"Officials";
    const [a,b]=s;
    if(a===1)return "Equipment & ball values"; if(a===2)return "Definitions";
    if(a===3){if(b<=9)return "The game & spotting"; if(b<=11)return "Fouls & penalty values"; if(b<=13)return "Free ball & play again"; if(b===14)return "Foul and a miss"; return "Other rules (3.15–3.21)";}
    if(a===4)return "Players"; return "Officials";
  }
  if(!s)return "The game";
  const [a,b]=s;
  if(a===1)return "Equipment"; if(a===2)return "Definitions";
  if(a===3){if(b<=7)return "Start, scoring & in-hand"; if(b===8)return "Baulk-line crossing"; if(b<=11)return "Spotting & limits"; if(b<=14)return "Edge, moved & touching ball"; return "Fouls & misses";}
  if(a===4)return "Players"; return "Officials";
}
const Q={S:[],B:[],P:[]};
for(const d of ["S","B","P"])BANK[d].forEach((raw,ri)=>{
  const red=!!(REDF[d]&&REDF[d][ri]);
  const isF=!Array.isArray(raw),q=isF?raw.q:raw[0],e=isF?raw.e:raw[2];
  Q[d].push(isF?{d,id:d+hash(q),q,fill:true,acc:raw.a.map(norm),show:raw.show,e,red,topic:topicOf(d,q,e)}

});
const ORDER={S:["Equipment & ball values","Definitions","The game & spotting","Fouls & penalty values","Free ball & play again","Foul and a miss","Other rules (3.15–3.21)","Players","Officials"],
 B:["Equipment","Definitions","Start, scoring & in-hand","Baulk-line crossing","Spotting & limits","Edge, moved & touching ball","Fouls & misses","Players","Officials","The game"],

const TOPICS={};for(const d in Q){const rank=t=>{const i=ORDER[d].indexOf(t);return i<0?99:i};
  Q[d]=Q[d].map((x,i)=>[x,i]).sort((a,b)=>rank(a[0].topic)-rank(b[0].topic)||a[1]-b[1]).map(a=>a[0]);
  TOPICS[d]=[...new Set(Q[d].map(x=>x.topic))]}

/* ---------- helpers ---------- */
const app=document.getElementById("app");
const store={get(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function norm(s){return String(s).toLowerCase().replace(/½/g,"1/2").replace(/[\s.\-'"“”()]/g,"").replace(/^the/,"")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function inst(x){if(x.fill)return {...x};const opts=shuffle(x.raw);return {...x,opts,correct:opts.indexOf(x.raw[0])}}
function isRight(q,a){if(a==null||a==="")return false;return q.fill?q.acc.includes(norm(a)):a===q.correct}
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

function record(q,a){PROG[q.id]=isRight(q,a)?1:0;store.set("prog-v2",PROG)}
function stats(d,topic){const list=Q[d].filter(x=>!topic||x.topic===topic);let r=0,w=0;list.forEach(x=>{if(PROG[x.id]===1)r++;else if(PROG[x.id]===0)w++});return {n:list.length,r,w}}

let timerId;

function startMock(key){
  const p=PAPERS[key],qs=[];

  }
