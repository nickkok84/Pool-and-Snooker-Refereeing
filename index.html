}
function bankList(){
  let list=Q[S.bd].filter(x=>(!S.btopic||x.topic===S.btopic)&&(!S.bred||x.red));
  if(S.bfilter==="new")list=list.filter(x=>PROG[x.id]==null);
  if(S.bfilter==="missed")list=list.filter(x=>PROG[x.id]===0);
  return S.border==="shuffle"?shuffle(list):list;
}
function startBank(){
  const list=bankList();if(!list.length)return;
  const qs=list.map(inst);
  S={...S,view:"quiz",kind:"bank",qs,ans:qs.map(()=>null),flag:qs.map(()=>false),locked:qs.map(()=>false),cur:0,confirm:false,gridOpen:false};
  saveBank();render();window.scrollTo(0,0);
}
function saveBank(){if(S.kind!=="bank")return;store.set("bank-session",{bd:S.bd,btopic:S.btopic,ids:S.qs.map(q=>q.id),ans:S.ans,cur:S.cur,
  opts:S.qs.map(q=>q.fill?null:q.opts)})}
function resumeBank(){
  const s=store.get("bank-session",null);if(!s)return;
  const byId={};Q[s.bd].forEach(x=>byId[x.id]=x);
  const qs=[],ans=[];s.ids.forEach((id,i)=>{const x=byId[id];if(!x)return;let q;
    if(x.fill)q={...x};else{const o=s.opts&&s.opts[i]&&s.opts[i].length===4&&s.opts[i].every(v=>x.raw.includes(v))?s.opts[i]:shuffle(x.raw);q={...x,opts:o,correct:o.indexOf(x.raw[0])}}
    qs.push(q);ans.push(s.ans[i]??null)});
  if(!qs.length)return;
  S={...S,view:"quiz",kind:"bank",bd:s.bd,btopic:s.btopic,qs,ans,flag:qs.map(()=>false),locked:ans.map(a=>a!=null&&a!==""),cur:Math.min(s.cur||0,qs.length-1),confirm:false,gridOpen:false};
  render();window.scrollTo(0,0);
}
function tick(){clearInterval(timerId);timerId=setInterval(()=>{const el=document.getElementById("timer");if(!el||S.view!=="quiz"){clearInterval(timerId);return}
  const left=S.end-Date.now();if(left<=0){clearInterval(timerId);finish();return}
  el.textContent=fmt(left);el.classList.toggle("low",left<300000)},500)}
function finish(){
  clearInterval(timerId);
  const res={};[...new Set(S.qs.map(q=>q.d))].forEach(d=>{const idx=S.qs.map((q,i)=>i).filter(i=>S.qs[i].d===d);res[d]={got:idx.filter(i=>isRight(S.qs[i],S.ans[i])).length,tot:idx.length,ans:idx.filter(i=>S.ans[i]!=null&&S.ans[i]!=="").length}});
  S.res=res;S.view="results";S.reviewWrong=true;
  if(S.kind==="mock"){S.qs.forEach((q,i)=>{if(S.ans[i]!=null&&S.ans[i]!=="")record(q,S.ans[i])});if(S.mode==="exam")store.set("last-"+S.paper,{res,at:Date.now()})}
  if(S.kind==="bank")store.del("bank-session");
  render();window.scrollTo(0,0);
}

/* ---------- views ---------- */
function render(){app.className="wrap"+(S.view==="home"?" wide":"");app.innerHTML=S.view==="home"?home():S.view==="quiz"?quiz():results();bind()}

function progRow(d){const s=stats(d),done=s.r+s.w;return `<div class="prog-row"><span>${NAMES[d]}</span><span class="bar2" aria-hidden="true"><i class="g" style="width:${s.r/s.n*100}%"></i><i class="r" style="width:${s.w/s.n*100}%"></i></span><span class="num">${done}/${s.n}${done?" · "+Math.round(s.r/done*100)+"%":""}</span></div>`}

function home(){
  const last=k=>{const v=store.get("last-"+k,null);if(!v)return"Not attempted yet";return"Last: "+Object.keys(v.res).map(d=>NAMES[d].split(" ").pop()+" "+v.res[d].got+"/"+v.res[d].tot).join(" · ")};
  const sess=store.get("bank-session",null);
  const n=bankList().length;
  const st=stats(S.bd,S.btopic);
  return `<div class="home">
  <header><div class="row" style="justify-content:space-between"><div class="eyebrow">Cuesports Singapore · "C" Grade Referee</div><span class="tag S" title="Version">v2.5</span></div><h1>Theory Mock Exams</h1>
  <p class="lead">${Q.S.length} Snooker, ${Q.B.length} English Billiards and ${Q.P.length} Pool questions written from the WPBSA and WPA rulebooks and your course slides. Pass mark is 75% for each discipline.</p></header>

  <section class="block" aria-labelledby="h-mock">
    <div><h2 id="h-mock">Mock test</h2><p class="muted small" style="margin:.2rem 0 0">Each mock draws a fresh random set in the real exam format, covering all the rules, with at least 60% of questions testing red slide wording, since those are certain to come out.</p></div>
    <div><div class="lbl">Mode</div><div class="seg" role="group" aria-label="Mode">
      <button id="mode-exam" aria-pressed="${S.mode==="exam"}">Exam · timed</button><button id="mode-practice" aria-pressed="${S.mode==="practice"}">Practice · see answers</button></div></div>
    <div><div class="lbl">Disciplines in this mock</div><div class="papers">
      ${["S","B","P"].map(d=>`<button class="paper pick" data-sel="${d}" aria-pressed="${!!S.sel[d]}"><span class="t">${S.sel[d]?"✓ ":""}${NAMES[d]}</span><span class="m">${PART[d].n} MCQ · ${S.mode==="exam"?PART[d].mins+" min":"untimed"} · pass ${PASS[d][0]}/${PASS[d][1]}</span></button>`).join("")}
    </div></div>
    <div class="row" style="justify-content:space-between"><span class="muted small">${selKey()?`${PAPERS[selKey()].name} · ${Object.values(PAPERS[selKey()].draw).reduce((a,b)=>a+b,0)} questions${S.mode==="exam"?" · "+PAPERS[selKey()].mins+" min":""}<br><span class="last">${last(selKey())}</span>`:"Pick at least one discipline"}</span>
      <button class="btn primary" id="go-mock" ${selKey()?"":"disabled"}>Start mock</button></div>
  </section>

  <section class="block" aria-labelledby="h-bank">
    <div><h2 id="h-bank">Question bank</h2><p class="muted small" style="margin:.2rem 0 0">Work through every question with the answer and rule reference shown as you go. Your results are remembered on this device.</p></div>
    ${sess?`<div class="card row" style="justify-content:space-between"><span>Unfinished: <b>${NAMES[sess.bd]}</b>${sess.btopic?" · "+esc(sess.btopic):""} — question ${Math.min((sess.cur||0)+1,sess.ids.length)} of ${sess.ids.length}</span><button class="btn primary" id="resume">Resume</button></div>`:""}
    <div><div class="lbl">Discipline</div><div class="seg" role="group" aria-label="Discipline">
      ${["S","B","P"].map(d=>`<button data-bd="${d}" aria-pressed="${S.bd===d}">${NAMES[d]} · ${Q[d].length}</button>`).join("")}</div></div>
    <div class="two">
      <div><label class="lbl" for="btopic">Topic</label><select id="btopic"><option value="">All topics (${Q[S.bd].filter(x=>!S.bred||x.red).length})</option>${TOPICS[S.bd].map(t=>`<option value="${esc(t)}" ${S.btopic===t?"selected":""}>${esc(t)} (${Q[S.bd].filter(x=>x.topic===t&&(!S.bred||x.red)).length})</option>`).join("")}</select></div>
      <div><div class="lbl">Order</div><div class="seg" role="group" aria-label="Order"><button id="ord-o" aria-pressed="${S.border==="order"}">In order</button><button id="ord-s" aria-pressed="${S.border==="shuffle"}">Shuffled</button></div></div>
    </div>
    <div><div class="lbl">Source</div><div class="seg" role="group" aria-label="Source">
      <button id="src-all" aria-pressed="${!S.bred}">All questions · ${Q[S.bd].length}</button><button id="src-red" aria-pressed="${S.bred}">Red slide wording only · ${Q[S.bd].filter(x=>x.red).length}</button></div></div>
    <div><div class="lbl">Which questions</div><div class="seg" role="group" aria-label="Which questions">
      <button id="f-all" aria-pressed="${S.bfilter==="all"}">All</button><button id="f-new" aria-pressed="${S.bfilter==="new"}">Not answered yet</button><button id="f-missed" aria-pressed="${S.bfilter==="missed"}">Got wrong last time</button></div></div>
    <div class="row" style="justify-content:space-between"><span class="muted small">${st.r+st.w} of ${st.n} answered here · ${st.r} right · ${st.w} wrong</span>
      <button class="btn primary" id="go-bank" ${n?"":"disabled"}>${n?"Start "+n+" question"+(n===1?"":"s"):"Nothing to practise"}</button></div>
  </section>

  <section class="block" id="sec-prog" aria-labelledby="h-prog">
    <h2 id="h-prog">Your progress</h2>
    <div class="stack" style="gap:8px">${["S","B","P"].map(progRow).join("")}</div>
    <p class="muted small" style="margin:0">Green is right and red is wrong on your latest attempt at each question, from mocks and the bank.</p>
    ${S.confirmReset?`<div class="confirm"><b>Clear all progress?</b> <span class="muted">This removes your right/wrong history and any unfinished session on this device.</span><div class="row" style="margin-top:10px"><button class="btn primary" id="reset-yes">Clear progress</button><button class="btn" id="reset-no">Cancel</button></div></div>`:`<div><button class="btn ghost" id="reset">Clear progress</button></div>`}
  </section>
  </div>`;
}

function quiz(){
  const q=S.qs[S.cur],a=S.ans[S.cur],n=S.qs.length,done=S.ans.filter(x=>x!=null&&x!=="").length;
  const instant=S.kind==="bank"||S.mode==="practice",locked=S.locked[S.cur];
  let body;
  if(q.fill){
    body=`<div class="fill"><input id="fillin" type="text" autocomplete="off" autocapitalize="off" placeholder="Type your answer" value="${esc(a??"")}" ${locked?"disabled":""}>${instant&&!locked?'<button class="btn primary" id="check">Check</button>':""}</div>`;
  }else{
    body=`<div class="opts">${q.opts.map((o,i)=>{let c="";if(locked){if(i===q.correct)c="right";else if(i===a)c="wrong"}
      return `<button class="opt ${c}" data-o="${i}" aria-pressed="${a===i}" ${locked?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`}).join("")}</div>`;
  }
  const exp=locked?`<div class="explain">${isRight(q,a)?'<b class="ok">Correct.</b>':'<b class="no">Not quite.</b> Answer: <b>'+esc(q.fill?q.show:q.opts[q.correct])+'</b>.'} ${esc(q.e)}</div>`:"";
  const ds=[...new Set(S.qs.map(x=>x.d))];
  const showGrid=n<=400;
  const grid=showGrid?ds.map(d=>(ds.length>1?`<div class="sec">${NAMES[d]}</div>`:"")+S.qs.map((x,i)=>x.d!==d?"":(()=>{let c=[];if(S.ans[i]!=null&&S.ans[i]!=="")c.push(instant&&S.locked[i]?(isRight(x,S.ans[i])?"r":"w"):"done");if(S.flag[i])c.push("fl");if(i===S.cur)c.push("cur");return `<button data-go="${i}" class="${c.join(" ")}" aria-label="Question ${i+1}">${i+1}</button>`})()).join("")).join(""):"";
  const title=S.kind==="mock"?`Mock · ${PAPERS[S.paper].name}`:`${NAMES[S.qs[0].d]}${S.btopic?" · "+esc(S.btopic):""}`;
  const rightSoFar=S.qs.filter((x,i)=>S.locked[i]&&isRight(x,S.ans[i])).length;
  return `<div class="bar"><div class="bar-in">
    <div style="min-width:0"><div style="font-family:var(--f-display);font-size:1.15rem;font-weight:700">${title}</div><div class="qnum">${done}/${n} answered${instant&&done?" · "+rightSoFar+" right":""}</div></div>
    ${S.kind==="mock"&&S.mode==="exam"?`<span class="timer" id="timer">${fmt(S.end-Date.now())}</span>`:`<span class="tag S">${S.kind==="bank"?"Bank":"Practice"}</span>`}
  </div><div class="prog"><i style="width:${(S.cur+1)/n*100}%"></i></div></div>
  <div class="card">
    <div class="row"><span class="tag ${q.d}">${NAMES[q.d]}${q.fill?" · fill in":""}</span>${q.red?'<span class="tag red" title="Tests wording shown in red on the course slides">Red slide</span>':""}${S.kind==="bank"?`<span class="tag t">${esc(q.topic)}</span>`:""}<span class="qnum">Q${S.cur+1} of ${n}</span></div>
    <div class="qtext">${esc(q.q)}</div>${body}${exp}
  </div>
  <div class="nav">
    <button class="btn" id="prev" ${S.cur===0?"disabled":""}>Previous</button>
    <button class="btn ghost flag" id="flag" aria-pressed="${S.flag[S.cur]}">${S.flag[S.cur]?"Flagged":"Flag"}</button>
    ${S.cur<n-1?'<button class="btn primary" id="next">Next</button>':'<button class="btn primary" id="submit">Finish</button>'}
  </div>
  ${S.confirm?`<div class="confirm"><b>${S.kind==="bank"?"End this session?":"Submit now?"}</b> <span class="muted">${n-done} unanswered${S.flag.some(Boolean)?", "+S.flag.filter(Boolean).length+" flagged":""}.${S.kind==="mock"?" Unanswered questions score zero.":""}</span><div class="row" style="margin-top:10px"><button class="btn primary" id="yes">${S.kind==="bank"?"End and see summary":"Submit and mark"}</button><button class="btn" id="no">Keep going</button></div></div>`:""}
  <p class="kbd-hint">Keyboard: <kbd>1</kbd>–<kbd>4</kbd> or <kbd>A</kbd>–<kbd>D</kbd> to answer · <kbd>Enter</kbd> or <kbd>→</kbd> next · <kbd>←</kbd> previous · <kbd>F</kbd> flag</p>
  <details style="margin-top:18px" ${S.gridOpen?"open":""} id="gridbox"><summary>All questions in this ${S.kind==="bank"?"session":"paper"}</summary>${showGrid?`<div class="grid">${grid}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn" id="submit2">${S.kind==="bank"?"End session":"Finish and mark"}</button><button class="btn ghost" id="quit">${S.kind==="bank"?"Save and exit":"Quit to menu"}</button></div></details>`;
}

function results(){
  const ds=Object.keys(S.res);
  const cards=ds.map(d=>{const r=S.res[d];
    if(S.kind==="mock"){const need=PASS[d][0],ok=r.got>=need;
      return `<div class="score"><div class="eyebrow">${NAMES[d]}</div><div class="n">${r.got}<small>/${r.tot}</small></div><div class="muted small">${Math.round(r.got/r.tot*100)}% · need ${need}</div><span class="pill ${ok?"pass":"fail"}">${ok?"Pass":"Not yet — "+(need-r.got)+" short"}</span></div>`}
    const pct=r.ans?Math.round(r.got/r.ans*100):0;
    return `<div class="score"><div class="eyebrow">${NAMES[d]}</div><div class="n">${r.got}<small>/${r.ans}</small></div><div class="muted small">${pct}% right of ${r.ans} answered (${r.tot} in session)</div><span class="pill ${pct>=75?"pass":"fail"}">${pct>=75?"At pass level":"Below 75%"}</span></div>`}).join("");
  const list=S.qs.map((q,i)=>{const a=S.ans[i],answered=a!=null&&a!=="",ok=isRight(q,a);
    if(S.reviewWrong&&(ok||(S.kind==="bank"&&!answered)))return"";
    const your=!answered?"<i>No answer</i>":esc(q.fill?a:q.opts[a]);
    return `<div class="rev ${ok?"ok":"no"}"><p class="qnum">Q${i+1} · ${NAMES[q.d]} · ${esc(q.topic)}${q.red?" · Red slide":""}</p><p><b>${esc(q.q)}</b></p>
      ${ok?"":`<p>Your answer: ${your}</p>`}<p>Answer: <b>${esc(q.fill?q.show:q.opts[q.correct])}</b></p><p class="muted">${esc(q.e)}</p></div>`}).join("");
  return `<div class="stack" style="gap:18px">
  <header><div class="eyebrow">${S.kind==="mock"?"Mock · "+PAPERS[S.paper].name+" · "+(S.mode==="exam"?"Exam":"Practice"):"Question bank · "+NAMES[S.qs[0].d]+(S.btopic?" · "+esc(S.btopic):"")}</div><h1>${S.kind==="mock"?"Your result":"Session summary"}</h1></header>
  <div class="scores">${cards}</div>
  <div class="row">${S.kind==="mock"?'<button class="btn primary" id="again">New mock (fresh questions)</button>':'<button class="btn primary" id="retry">Practise the ones I got wrong</button>'}<button class="btn" id="menu">Back to menu</button></div>
  <div class="row" style="justify-content:space-between"><h2>Review</h2>
   <div class="seg" style="min-width:0"><button id="rw" aria-pressed="${S.reviewWrong}">Missed only</button><button id="ra" aria-pressed="${!S.reviewWrong}">All</button></div></div>
  <div class="stack">${list||'<p class="muted">Nothing missed. Well done.</p>'}</div></div>`;
}

/* ---------- events ---------- */
function bind(){
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.addEventListener("click",f)};
  if(S.view==="home"){
    on("mode-exam",()=>{S.mode="exam";render()});on("mode-practice",()=>{S.mode="practice";render()});
    on("go-mock",()=>startMock(selKey()));app.querySelectorAll("[data-sel]").forEach(b=>b.addEventListener("click",()=>{S.sel={...S.sel,[b.dataset.sel]:!S.sel[b.dataset.sel]};store.set("mock-sel",S.sel);render()}));
    app.querySelectorAll("[data-bd]").forEach(b=>b.addEventListener("click",()=>{S.bd=b.dataset.bd;S.btopic="";render()}));
    const sel=document.getElementById("btopic");if(sel)sel.addEventListener("change",()=>{S.btopic=sel.value;render()});
    on("ord-o",()=>{S.border="order";render()});on("src-all",()=>{S.bred=false;render()});on("src-red",()=>{S.bred=true;render()});on("ord-s",()=>{S.border="shuffle";render()});
    on("f-all",()=>{S.bfilter="all";render()});on("f-new",()=>{S.bfilter="new";render()});on("f-missed",()=>{S.bfilter="missed";render()});
    on("go-bank",startBank);on("resume",resumeBank);
    on("reset",()=>{S.confirmReset=true;render()});on("reset-no",()=>{S.confirmReset=false;render()});
    on("reset-yes",()=>{PROG={};store.set("prog-v2",{});store.del("bank-session");["S","B","P","SB","SP","BP","SBP","sb","p"].forEach(k=>store.del("last-"+k));S.confirmReset=false;render()});
  }
  if(S.view==="quiz"){
    const instant=S.kind==="bank"||S.mode==="practice";
    const save=()=>{const f=document.getElementById("fillin");if(f&&!S.locked[S.cur])S.ans[S.cur]=f.value.trim()};
    const lock=()=>{S.locked[S.cur]=true;if(S.kind==="bank")record(S.qs[S.cur],S.ans[S.cur]);saveBank()};
    const go=i=>{save();S.cur=i;S.confirm=false;saveBank();render();window.scrollTo(0,0)};
    app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{S.ans[S.cur]=+b.dataset.o;if(instant)lock();render()}));
    const f=document.getElementById("fillin");
    const lockFill=()=>{save();if(!S.ans[S.cur])return;lock();render()};
    if(f){f.addEventListener("input",()=>{S.ans[S.cur]=f.value.trim()});f.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(instant&&!S.locked[S.cur])lockFill();else if(S.cur<S.qs.length-1)go(S.cur+1)}});if(!S.locked[S.cur])f.focus({preventScroll:true})}
    on("check",lockFill);
    on("prev",()=>go(S.cur-1));on("next",()=>go(S.cur+1));
    on("flag",()=>{save();S.flag[S.cur]=!S.flag[S.cur];render()});
    const ask=()=>{save();S.confirm=true;render();document.getElementById("yes")?.focus()};
    on("submit",ask);on("submit2",ask);on("yes",()=>{save();finish()});on("no",()=>{S.confirm=false;render()});
    on("quit",()=>{clearInterval(timerId);save();saveBank();S.view="home";render();window.scrollTo(0,0)});
    app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{S.gridOpen=true;go(+b.dataset.go)}));
    const gb=document.getElementById("gridbox");if(gb)gb.addEventListener("toggle",()=>{S.gridOpen=gb.open});
  }
  if(S.view==="results"){
    on("again",()=>startMock(S.paper));
    on("retry",()=>{const wrong=S.qs.filter((q,i)=>S.locked[i]&&!isRight(q,S.ans[i]));if(!wrong.length){S.view="home";render();return}
      const qs=shuffle(wrong).map(x=>inst(Q[x.d].find(y=>y.id===x.id)));
      S={...S,view:"quiz",kind:"bank",qs,ans:qs.map(()=>null),flag:qs.map(()=>false),locked:qs.map(()=>false),cur:0,confirm:false};saveBank();render();window.scrollTo(0,0)});
    on("menu",()=>{S.view="home";render();window.scrollTo(0,0)});
    on("rw",()=>{S.reviewWrong=true;render()});on("ra",()=>{S.reviewWrong=false;render()});
  }
}
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz"||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target&&e.target.tagName)||"";if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA")return;
  if(e.key==="Enter"&&(tag==="BUTTON"||tag==="SUMMARY"))return;
  const k=e.key.toLowerCase();const map={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};
  const click=id=>{const el=document.getElementById(id);if(el&&!el.disabled){el.click();return true}return false};
  if(k in map){const o=app.querySelectorAll(".opt")[map[k]];if(o&&!o.disabled){e.preventDefault();o.click()}return}
  if(k==="enter"||k==="arrowright"){if(S.confirm){e.preventDefault();click("yes");return}e.preventDefault();click("next")||click("submit");return}
  if(k==="arrowleft"){e.preventDefault();click("prev");return}
  if(k==="f"){e.preventDefault();click("flag")}
});
render();
</script>

</body>
